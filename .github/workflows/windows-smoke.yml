name: Windows smoke

# #1329. Every other workflow in this repo is `ubuntu-latest`, which is why
# a module-scope `import fcntl` — fatal at CLI entry on Windows, `aelf
# --help` included — shipped and was found by a user rather than by CI.
#
# Deliberately narrow, and NOT a required check. It answers one question:
# does aelfrice import and run its portability surface on a host that has no
# `fcntl`? The full suite is not run here — much of it assumes POSIX
# semantics (permission bits, symlinks, `/tmp` layouts) and making it green
# on Windows is a much larger piece of work than making the tool start.
#
# Do not promote this to required without first widening what it covers;
# a required check this narrow buys confidence it has not earned.

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/test_windows_portability_1329.py'
      - 'tests/test_windows_launcher_1412.py'
      - 'tests/test_codex_windows_ownership_1412.py'
      - 'tests/test_doctor_windows_prune_1412.py'
      - 'tests/test_stdin_encoding_1426.py'
      - '.github/workflows/windows-smoke.yml'
      - 'pyproject.toml'
      # #1493 — the wheel job packages the tree, so a lock change can move
      # what it installs without touching src/ or pyproject.toml.
      - 'uv.lock'

permissions:
  contents: read

env:
  # #1472. tests/conftest.py scales every pytest-timeout budget by this
  # factor so a loaded developer machine does not lose tests that have no
  # defect. CI runs on a dedicated runner and wants the unscaled budgets:
  # a 4x-looser timeout is 4x longer to notice a hang, and neither this
  # workflow's `pytest` step nor `publish.yml`'s carries a
  # `timeout-minutes` backstop.
  #
  # Pinned per workflow, and not inferred from `CI` being set: `CI` is
  # commonly exported in local shells, so the implicit form would change
  # local behaviour silently. tests/test_timeout_scale_1472.py asserts
  # every one of these five files carries this line.
  AELF_TEST_TIMEOUT_SCALE: "1"

concurrency:
  group: windows-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      # No `step-security/harden-runner` here, unlike every other workflow:
      # its egress policy is implemented with Linux networking primitives
      # and it is a no-op-or-failure on Windows runners. This is the first
      # non-Linux job in the repo, so it is also the first place that
      # distinction has had to be made.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # zizmor artipacked: nothing here pushes, so the token has no
          # reason to persist into the runner's git config.
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --frozen --group dev

      # The reported failure, asserted directly: on Windows this died at
      # import before argparse ever ran.
      - name: aelf --help must run
        run: uv run aelf --help

      - name: aelf doctor must not crash at import
        # doctor exits 1 on structural failure, which is a legitimate
        # outcome on a host with no hooks installed. Only an import-time
        # crash is a failure here, so any exit code is accepted as long as
        # the process produced output rather than a traceback.
        shell: bash
        run: |
          out=$(uv run aelf doctor 2>&1) || true
          echo "$out"
          if grep -qi "ModuleNotFoundError\|ImportError\|Traceback" <<<"$out"; then
            echo "::error::aelf doctor failed at import on Windows"
            exit 1
          fi

      - name: portability suite
        run: uv run pytest tests/test_windows_portability_1329.py -q

      # #1426. The blocking gate for this is the POSIX cp1252 simulation in
      # ci.yml — this workflow is deliberately not required, per the header.
      # This arm is the native confirmation the simulation stands in for:
      # a real Windows console, a real redirected stdin, real console
      # scripts installed into Scripts/.
      - name: stdin utf-8 boundary (native confirmation)
        run: uv run pytest tests/test_stdin_encoding_1426.py -q

      - name: launcher and Codex ownership suites
        run: >
          uv run pytest
          tests/test_windows_launcher_1412.py
          tests/test_codex_windows_ownership_1412.py
          tests/test_doctor_windows_prune_1412.py -q

      # #1412 AC1. Those suites drive the Windows branch through the
      # `windows=` seam, which is exactly as good as the seam's fidelity to
      # the real platform. This step uses no seam at all: real console
      # launchers installed by uv into `Scripts`, real `os.name`, real
      # `shutil.which`. It is the only arm that can catch the seam itself
      # being wrong.
      - name: Codex setup is idempotent against real console launchers
        shell: bash
        run: |
          uv run python - <<'PY'
          import json, os, shutil, tempfile
          from pathlib import Path

          from aelfrice import launcher
          from aelfrice.host_codex import (
              desired_codex_hooks, doctor_codex,
              install_codex_hooks, remove_codex_hooks,
          )

          assert os.name == "nt", os.name

          # The launcher this host actually installed, and its real suffix.
          resolved = launcher.which_in(launcher.scripts_dir(), "aelf-hook")
          assert resolved is not None, (
              f"no aelf-hook under {launcher.scripts_dir()}"
          )
          assert resolved.suffix.lower() in {".exe", ".cmd", ".bat"}, resolved
          assert launcher.launcher_key(str(resolved)) == "aelf-hook", resolved
          print("resolved launcher ->", resolved)

          root = Path(tempfile.mkdtemp(prefix="aelfrice-codex-"))
          hooks = root / "hooks.json"

          first = install_codex_hooks(hooks)
          before = hooks.read_bytes()
          second = install_codex_hooks(hooks)
          after = hooks.read_bytes()

          assert first.changed is True, "first setup must write"
          assert second.changed is False, "second setup must be a no-op"
          assert before == after, "hooks.json changed on the second setup"

          counts = {
              e: len(g) for e, g in json.loads(after)["hooks"].items()
          }
          assert set(counts.values()) == {1}, counts
          print("group counts ->", counts)

          report = doctor_codex(root)
          assert report.owned_handler_count > 0, report
          assert report.missing_events == [], report.missing_events
          assert report.stale_commands == [], report.stale_commands

          # A foreign handler sharing a group must survive uninstall.
          doc = json.loads(hooks.read_text(encoding="utf-8"))
          doc["hooks"]["UserPromptSubmit"][0]["hooks"].append(
              {"type": "command", "command": r"C:\Tools\foreign-hook.exe"},
          )
          hooks.write_text(json.dumps(doc, indent=2) + "\n", encoding="utf-8")

          remove_codex_hooks(hooks)
          left = json.loads(hooks.read_text(encoding="utf-8"))["hooks"]
          surviving = json.dumps(left)
          assert "foreign-hook" in surviving, surviving
          assert "aelf-hook" not in surviving, surviving
          assert set(left) <= {"UserPromptSubmit"}, left
          print("uninstall left ->", surviving)

          shutil.rmtree(root, ignore_errors=True)
          print("OK:", len(desired_codex_hooks()), "events")
          PY

      # The one assertion that cannot be made from POSIX CI: that the
      # encoder agrees with the directory name this host actually produces.
      - name: the encoder produces a creatable directory name
        shell: bash
        run: |
          uv run python -c "
          from pathlib import Path
          from aelfrice.claude_memory import encode_project_path, derive_memory_dir
          encoded = encode_project_path(str(Path.cwd()))
          assert ':' not in encoded, encoded
          assert '\\\\' not in encoded, encoded
          assert len(Path(encoded).parts) == 1, encoded
          d = derive_memory_dir(Path.cwd())
          d.mkdir(parents=True, exist_ok=True)
          assert d.is_dir()
          print('encoded ->', encoded)
          "

  # -------------------------------------------------------------------------
  # #1493 / #1417 — the same host, but the artifact users install.
  #
  # The job above answers "does the source tree run on Windows". This one
  # answers "does the wheel", which is a different question and the one
  # #1417 is actually about: that issue reproduces against `aelfrice==4.2.0`
  # from PyPI, and the evidence that `main` fixes it is a source-checkout
  # run. Nothing had ever exercised the packaged artifact on this platform.
  #
  # Everything here runs from `$RUNNER_TEMP`, not the checkout. With a
  # `src/` layout a cwd import cannot reach the package anyway, but the
  # distinction is the whole point of the job and is worth being structural
  # rather than incidental — a future flat-layout or a stray `conftest.py`
  # would otherwise let the working tree satisfy the assertions.
  wheel:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Build the wheel
        run: uv build --wheel --out-dir dist

      - name: Install that wheel into a clean environment
        shell: bash
        run: |
          set -euo pipefail
          uv venv "$RUNNER_TEMP/wheelenv"
          # Exactly one wheel, named. A glob passed straight to `uv pip
          # install` would install whatever it matched and say nothing if
          # the build had produced two.
          mapfile -t wheels < <(ls dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "::error::expected exactly one wheel, got: ${wheels[*]}"
            exit 1
          fi
          uv pip install --python "$RUNNER_TEMP/wheelenv/Scripts/python.exe" "${wheels[0]}"

      - name: The installed console script starts
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/wheelenv/Scripts/aelf.exe" --version

      - name: doctor reads the Codex host without crashing
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          CODEX_HOME: ${{ runner.temp }}/codex
        run: |
          set -euo pipefail
          mkdir -p "$CODEX_HOME"
          # doctor exits non-zero on structural failure, which is the
          # correct outcome on a host with nothing installed. Only an
          # import-time or path-handling crash fails this step.
          out=$("$RUNNER_TEMP/wheelenv/Scripts/aelf.exe" doctor --host codex 2>&1) || true
          echo "$out"
          if grep -qiE 'ModuleNotFoundError|ImportError|Traceback' <<<"$out"; then
            echo "::error::aelf doctor --host codex crashed on the installed wheel"
            exit 1
          fi

      # #1412: setup was not idempotent on native Windows — every hook group
      # doubled on a second run. Both runs exit 0, so the exit code proves
      # nothing; the assertion has to be on a count. doctor prints one:
      # `aelfrice_handlers=N`.
      - name: setup is idempotent, and unsetup removes what it installed
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-idem
        run: |
          set -euo pipefail
          AELF="$RUNNER_TEMP/wheelenv/Scripts/aelf.exe"
          mkdir -p "$CODEX_HOME"

          handlers() {
            "$AELF" doctor --host codex 2>&1 \
              | grep -oE 'aelfrice_handlers=[0-9]+' \
              | head -1 | cut -d= -f2
          }

          "$AELF" setup --host codex
          first="$(handlers)"
          if [ -z "$first" ] || [ "$first" -eq 0 ]; then
            echo "::error::setup installed nothing (aelfrice_handlers=${first:-<absent>})"
            exit 1
          fi

          "$AELF" setup --host codex
          second="$(handlers)"
          if [ "$second" != "$first" ]; then
            echo "::error::setup is not idempotent: $first handlers became $second"
            exit 1
          fi
          echo "idempotent at $first handlers"

          "$AELF" unsetup --host codex
          after="$(handlers)"
          if [ "${after:-0}" -ne 0 ]; then
            echo "::error::unsetup left $after handler(s) behind"
            exit 1
          fi
