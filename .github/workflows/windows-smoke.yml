name: Windows smoke

# #1329. Every other workflow in this repo is `ubuntu-latest`, which is why
# a module-scope `import fcntl` — fatal at CLI entry on Windows, `aelf
# --help` included — shipped and was found by a user rather than by CI.
#
# Deliberately narrow, and NOT a required check. It answers one question:
# does aelfrice import and run its portability surface on a host that has no
# `fcntl`? The full suite is not run here — much of it assumes POSIX
# semantics (permission bits, symlinks, `/tmp` layouts) and making it green
# on Windows is a much larger piece of work than making the tool start.
#
# Do not promote this to required without first widening what it covers;
# a required check this narrow buys confidence it has not earned.

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/test_windows_portability_1329.py'
      - 'tests/test_windows_launcher_1412.py'
      - 'tests/test_codex_windows_ownership_1412.py'
      - 'tests/test_doctor_windows_prune_1412.py'
      - '.github/workflows/windows-smoke.yml'
      - 'pyproject.toml'

permissions:
  contents: read

concurrency:
  group: windows-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      # No `step-security/harden-runner` here, unlike every other workflow:
      # its egress policy is implemented with Linux networking primitives
      # and it is a no-op-or-failure on Windows runners. This is the first
      # non-Linux job in the repo, so it is also the first place that
      # distinction has had to be made.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # zizmor artipacked: nothing here pushes, so the token has no
          # reason to persist into the runner's git config.
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --frozen --group dev

      # The reported failure, asserted directly: on Windows this died at
      # import before argparse ever ran.
      - name: aelf --help must run
        run: uv run aelf --help

      - name: aelf doctor must not crash at import
        # doctor exits 1 on structural failure, which is a legitimate
        # outcome on a host with no hooks installed. Only an import-time
        # crash is a failure here, so any exit code is accepted as long as
        # the process produced output rather than a traceback.
        shell: bash
        run: |
          out=$(uv run aelf doctor 2>&1) || true
          echo "$out"
          if grep -qi "ModuleNotFoundError\|ImportError\|Traceback" <<<"$out"; then
            echo "::error::aelf doctor failed at import on Windows"
            exit 1
          fi

      - name: portability suite
        run: uv run pytest tests/test_windows_portability_1329.py -q

      - name: launcher and Codex ownership suites
        run: >
          uv run pytest
          tests/test_windows_launcher_1412.py
          tests/test_codex_windows_ownership_1412.py
          tests/test_doctor_windows_prune_1412.py -q

      # #1412 AC1. Those suites drive the Windows branch through the
      # `windows=` seam, which is exactly as good as the seam's fidelity to
      # the real platform. This step uses no seam at all: real console
      # launchers installed by uv into `Scripts`, real `os.name`, real
      # `shutil.which`. It is the only arm that can catch the seam itself
      # being wrong.
      - name: Codex setup is idempotent against real console launchers
        shell: bash
        run: |
          uv run python - <<'PY'
          import json, os, shutil, tempfile
          from pathlib import Path

          from aelfrice import launcher
          from aelfrice.host_codex import (
              desired_codex_hooks, doctor_codex,
              install_codex_hooks, remove_codex_hooks,
          )

          assert os.name == "nt", os.name

          # The launcher this host actually installed, and its real suffix.
          resolved = launcher.which_in(launcher.scripts_dir(), "aelf-hook")
          assert resolved is not None, (
              f"no aelf-hook under {launcher.scripts_dir()}"
          )
          assert resolved.suffix.lower() in {".exe", ".cmd", ".bat"}, resolved
          assert launcher.launcher_key(str(resolved)) == "aelf-hook", resolved
          print("resolved launcher ->", resolved)

          root = Path(tempfile.mkdtemp(prefix="aelfrice-codex-"))
          hooks = root / "hooks.json"

          first = install_codex_hooks(hooks)
          before = hooks.read_bytes()
          second = install_codex_hooks(hooks)
          after = hooks.read_bytes()

          assert first.changed is True, "first setup must write"
          assert second.changed is False, "second setup must be a no-op"
          assert before == after, "hooks.json changed on the second setup"

          counts = {
              e: len(g) for e, g in json.loads(after)["hooks"].items()
          }
          assert set(counts.values()) == {1}, counts
          print("group counts ->", counts)

          report = doctor_codex(root)
          assert report.owned_handler_count > 0, report
          assert report.missing_events == [], report.missing_events
          assert report.stale_commands == [], report.stale_commands

          # A foreign handler sharing a group must survive uninstall.
          doc = json.loads(hooks.read_text(encoding="utf-8"))
          doc["hooks"]["UserPromptSubmit"][0]["hooks"].append(
              {"type": "command", "command": r"C:\Tools\foreign-hook.exe"},
          )
          hooks.write_text(json.dumps(doc, indent=2) + "\n", encoding="utf-8")

          remove_codex_hooks(hooks)
          left = json.loads(hooks.read_text(encoding="utf-8"))["hooks"]
          surviving = json.dumps(left)
          assert "foreign-hook" in surviving, surviving
          assert "aelf-hook" not in surviving, surviving
          assert set(left) <= {"UserPromptSubmit"}, left
          print("uninstall left ->", surviving)

          shutil.rmtree(root, ignore_errors=True)
          print("OK:", len(desired_codex_hooks()), "events")
          PY

      # The one assertion that cannot be made from POSIX CI: that the
      # encoder agrees with the directory name this host actually produces.
      - name: the encoder produces a creatable directory name
        shell: bash
        run: |
          uv run python -c "
          from pathlib import Path
          from aelfrice.claude_memory import encode_project_path, derive_memory_dir
          encoded = encode_project_path(str(Path.cwd()))
          assert ':' not in encoded, encoded
          assert '\\\\' not in encoded, encoded
          assert len(Path(encoded).parts) == 1, encoded
          d = derive_memory_dir(Path.cwd())
          d.mkdir(parents=True, exist_ok=True)
          assert d.is_dir()
          print('encoded ->', encoded)
          "
