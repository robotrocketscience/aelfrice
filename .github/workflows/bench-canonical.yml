name: Bench Canonical

# v2.0 reproducibility harness nightly cron (#437 deliverable C).
#
# Runs `aelf bench all` at the canonical headline cut (full per the
# 2026-05-06 ratification — LongMemEval full, StructMemEval --bench
# big, all 11 invocations). Writes the merged JSON to the dedicated
# `bench-canonical-results` branch and band-checks against
# `benchmarks/results/v2.0.0.json` from main.
#
# Why a dedicated branch (not `main`):
# same rationale as `replay-soak.yml` after #461 — the `main` ruleset
# blocks unsigned bot pushes and direct pushes. `bench-canonical-results`
# is unconstrained, which lets the cron commit cron snapshots without
# a long-lived signing key.
#
# Runtime budget: spec says multi-hour at the full cut. `timeout-minutes`
# is 360 (6h) to leave headroom; the operator can tune down once a few
# real cron entries land.

on:
  schedule:
    # 05:00 UTC daily — staggered after `replay-soak` (04:00) so a
    # single GitHub Actions runner pool doesn't see two long-running
    # crons concurrent.
    - cron: '0 5 * * *'
  workflow_dispatch:
    # Manual trigger lets the operator force a cron entry mid-day
    # after a deliberate canonical re-run.

permissions:
  contents: write
  # `contents: write` so the cron can push to `bench-canonical-results`.

concurrency:
  group: bench-canonical
  cancel-in-progress: false

jobs:
  canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dev group
        run: uv sync --frozen --group dev --extra archive --extra benchmarks

      - name: Bootstrap bench-canonical-results worktree
        run: |
          set -euo pipefail
          # Fetch the dedicated branch; create empty if first run.
          if git ls-remote --exit-code origin bench-canonical-results > /dev/null 2>&1; then
            git fetch origin bench-canonical-results:refs/remotes/origin/bench-canonical-results
            git worktree add .bench-results-branch \
              -B bench-canonical-results origin/bench-canonical-results
          else
            git worktree add --orphan -b bench-canonical-results .bench-results-branch
            (cd .bench-results-branch && git rm -rf . 2>/dev/null || true)
          fi

      - name: Run aelf bench all --canonical
        id: bench
        # scripts/bench_canonical_step.py writes `out` to GITHUB_OUTPUT
        # before the bench starts and `rc` after it ends. Exit 2 means an
        # adapter's dataset was missing: the run finished, wrote its JSON,
        # and the band check reads those adapters as SKIP. This step fails
        # only on another exit code or a missing JSON. There is no
        # continue-on-error: the steps below run on `!cancelled()`, and
        # the last step reads `rc` itself (audit CI-01).
        run: |
          set -euo pipefail
          today=$(date -u +%Y-%m-%d)
          out=".bench-results-branch/v2.0.0-cron-${today}.json"
          # `--canonical` so the dispatcher refuses if the cut doesn't
          # match CANONICAL_INVOCATIONS.
          python3 scripts/bench_canonical_step.py run --out "${out}" -- \
            uv run aelf bench all --canonical --out "${out}"

      - name: Band-check vs canonical
        id: bandcheck
        # Runs whatever the bench step did. The gate is the JSON file
        # (`test -s` below), not a step output: the old gate read `out`,
        # which the bench step never wrote when the bench exited 2, so
        # this step was skipped on every night with a missing dataset.
        if: ${{ !cancelled() }}
        env:
          OUT: ${{ steps.bench.outputs.out }}
        run: |
          set -euo pipefail
          if [ -z "${OUT}" ] || ! test -s "${OUT}"; then
            echo "::error::no bench JSON to band-check (out='${OUT}')"
            exit 1
          fi
          uv run python -c "
          import os, sys
          from pathlib import Path
          from benchmarks import tolerance
          cano = tolerance.load_report(Path('benchmarks/results/v2.0.0.json'))
          obs = tolerance.load_report(Path(os.environ['OUT']))
          checks = tolerance.check_report(cano, obs)
          overall, counts = tolerance.summarize(checks)
          print(f'overall: {overall.value}; counts: {counts}')
          for c in checks:
              if c.verdict.value != 'pass':
                  print(f'  {\"/\".join(c.path)}: {c.verdict.value} — {c.note}')
          # 'no_data' fails the job alongside 'fail' (#1160): an
          # all-SKIP run measured nothing, and reporting that as
          # success is what let a broken dataset download look like a
          # green calibration. 'warn' stays non-blocking. Timing
          # metrics (tolerance.WARN_ONLY_METRICS: avg_latency_ms and
          # total_ingest_time_s) report a band breach as 'warn', so
          # runner wall-clock drift never fails this step. Quality
          # metrics and corpus invariants still fail (CI-01).
          sys.exit(1 if overall.value in ('fail', 'no_data') else 0)
          "

      - name: Compute badge text
        # Renders the one-line badge from the merged JSON. Uses
        # `benchmarks.badge` (unit-tested) so the workflow stays free
        # of count logic. Output is stashed in $GITHUB_OUTPUT for the
        # next step. Runs when the bench finished (rc 0, or 2 for a
        # partial run). Skips when it errored, which leaves the previous
        # badge in place rather than rewriting to a stale 0/N line.
        id: badge
        if: ${{ !cancelled() && (steps.bench.outputs.rc == '0' || steps.bench.outputs.rc == '2') }}
        env:
          OUT: ${{ steps.bench.outputs.out }}
        run: |
          set -euo pipefail
          text=$(uv run python -m benchmarks.badge "${OUT}")
          echo "text=${text}" >> "$GITHUB_OUTPUT"
          echo "computed: ${text}"

      - name: Sync README into bench-canonical-results worktree + rewrite badge
        # Issue #477: badge in README on the bench-canonical-results
        # branch is auto-rewritten on each cron run. main is not
        # touched (operator cherry-picks if they want main current).
        # README is copied from the main checkout each run so the
        # bench-canonical-results branch never carries a stale README.
        if: ${{ !cancelled() && steps.badge.outputs.text != '' }}
        env:
          BADGE_TEXT: ${{ steps.badge.outputs.text }}
        run: |
          set -euo pipefail
          cp README.md .bench-results-branch/README.md
          new="${BADGE_TEXT}" awk '
            BEGIN { in_block=0 }
            /<!-- bench-canonical-badge:start -->/ { print; print ENVIRON["new"]; in_block=1; next }
            /<!-- bench-canonical-badge:end -->/   { print; in_block=0; next }
            in_block { next }
            { print }
          ' .bench-results-branch/README.md > .bench-results-branch/README.md.new
          mv .bench-results-branch/README.md.new .bench-results-branch/README.md

      - name: Commit + push to bench-canonical-results
        # Commits the night's JSON even when the band check failed.
        if: ${{ !cancelled() }}
        env:
          GIT_AUTHOR_NAME: aelfrice-bench-bot
          GIT_AUTHOR_EMAIL: aelfrice-bench-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: aelfrice-bench-bot
          GIT_COMMITTER_EMAIL: aelfrice-bench-bot@users.noreply.github.com
        run: |
          set -euo pipefail
          cd .bench-results-branch
          if git status --porcelain | grep -q .; then
            today=$(date -u +%Y-%m-%d)
            git add -A
            git commit -m "audit(bench-canonical): ${today} entry"
            git push origin HEAD:bench-canonical-results
          else
            echo "no bench-canonical delta to commit"
          fi

      - name: Fail job unless the band check passed
        # Fails when the band check failed, when it was skipped or never
        # reached, or when the bench exit code is not 0 or 2. It reads
        # `rc` and the band-check outcome itself, so the job's result does
        # not depend on an earlier step's failure surviving to the end.
        if: ${{ !cancelled() }}
        env:
          BENCH_RC: ${{ steps.bench.outputs.rc }}
          BANDCHECK_OUTCOME: ${{ steps.bandcheck.outcome }}
        run: |
          set -euo pipefail
          python3 scripts/bench_canonical_step.py verdict \
            --rc "${BENCH_RC}" --bandcheck "${BANDCHECK_OUTCOME}"
