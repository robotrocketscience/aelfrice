name: zizmor

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  schedule:
    - cron: '0 12 * * 1'
  # #1423: the `push` arm above cannot fire — the merge train FF-pushes with
  # `secrets.GITHUB_TOKEN` and GitHub raises no workflow runs from that token.
  # `merge-train.yml` dispatches this workflow after a successful FF. `paths:`
  # filters do not apply to a dispatch, so a dispatched run scans on every
  # merge rather than only on merges that touched `.github/` — a uvx run, and
  # the alternative is teaching the train which filters to honour.
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Run zizmor
        run: uvx zizmor --format sarif . > zizmor.sarif
        continue-on-error: true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: zizmor.sarif
          category: zizmor
