name: zizmor

on:
  # No `paths:` filter, so every PR gets the high-severity gate below.
  # zizmor reads files outside `.github/workflows/`: an `action.yml` or
  # `action.yaml` anywhere in the tree, `dependabot.yml` or `dependabot.yaml`,
  # the pre-commit configs, and its own `zizmor.yml` in the root or
  # `.github/`, which can switch a rule off. A path list that missed one would
  # let a PR change that file with no `zizmor` check, and an absent check does
  # not block the train (#1786).
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 12 * * 1'
  # #1423: the `push` arm above cannot fire — the merge train FF-pushes with
  # `secrets.GITHUB_TOKEN` and GitHub raises no workflow runs from that token.
  # `merge-train.yml` dispatches this workflow after a successful FF, so a
  # dispatched run scans every merge.
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      # Two runs. The first writes every finding to SARIF for code scanning
      # and never fails (`--no-exit-codes`). The second is the gate: it
      # exits non-zero on any finding at high severity, and nothing here
      # swallows that exit, so the `zizmor` check fails the PR (#1786).
      # Medium and lower findings reach code scanning but do not block.
      - name: Run zizmor
        run: uvx zizmor@1.31.1 --no-exit-codes --format sarif . > zizmor.sarif
      - uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          sarif_file: zizmor.sarif
          category: zizmor
      - name: Fail on high-severity findings
        run: uvx zizmor@1.31.1 --min-severity high .
