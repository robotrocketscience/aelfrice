name: CI

on:
  pull_request:
    branches: [main]
    # No paths-ignore: the workflow must always run so the
    # `pytest (3.12)` and `pytest (3.13)` required status checks
    # report on every PR — including docs-only ones. Path detection
    # happens inside the job via `dorny/paths-filter`; non-code PRs
    # short-circuit the install + test steps and report success.
    # Per #413/#427 follow-up: replaces the previous `paths-ignore`
    # filter that silently dropped the pytest check on docs-only PRs
    # and blocked them under `required_status_checks`.
  # #1436 — manual escape hatch. `workflow_dispatch` is delivered through the
  # REST API (`POST .../workflows/{id}/dispatches`), not the webhook path that
  # carries `pull_request` events, so it still fires when delivery is degraded
  # and a PR would otherwise be permanently unmergeable.
  #
  # Deliberately NO `ref` input. The built-in dispatch ref is the targeting
  # mechanism, and it is also the safety property (#1436 AC5): a run's
  # check-runs attach to the head SHA of the ref it was dispatched on, and
  # merge-train reads `commits/${HEAD_SHA}/check-runs`. So a dispatch can only
  # ever report against the commit it actually tested. A `ref` *input* would
  # break exactly that — checkout would test one ref while the check-runs
  # landed on another, which is a way to skip the gate rather than re-run it.
  workflow_dispatch:

permissions:
  contents: read

env:
  # #1472. tests/conftest.py scales every pytest-timeout budget by this
  # factor so a loaded developer machine does not lose tests that have no
  # defect. CI runs on a dedicated runner and wants the unscaled budgets:
  # a 4x-looser timeout is 4x longer to notice a hang. The `pytest` job
  # below has a 30-minute `timeout-minutes` backstop for the whole leg.
  #
  # Pinned per workflow, and not inferred from `CI` being set: `CI` is
  # commonly exported in local shells, so the implicit form would change
  # local behaviour silently. tests/test_timeout_scale_1472.py asserts
  # every one of these five files carries this line.
  AELF_TEST_TIMEOUT_SCALE: "1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    # Pinned image rather than `ubuntu-latest`, for the two required legs
    # only: a label move can change the system Python and SQLite a leg
    # resolves, under a required check, with no commit to point at. The
    # other jobs here keep `ubuntu-latest`.
    runs-on: ubuntu-24.04
    # A hung leg is cancelled at 30 minutes instead of the platform's
    # 360. Recent green legs took 11 to 14 minutes.
    timeout-minutes: 30
    strategy:
      # One leg failing must not cancel the other: a 3.12-only failure and
      # a failure on both versions are different diagnoses.
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # Path detection is a pull_request-only optimisation. A manual dispatch
      # is fired precisely when someone needs this check to report, so it runs
      # the suite unconditionally rather than inferring "no code changed" from
      # a diff base that a dispatch does not carry. Erring toward running is
      # the #1160 lesson: a skipped job must never report a pass that looks
      # like a run.
      - if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              # `pythonpath = ["."]` in pyproject.toml makes these two
              # top-level packages importable from the suite, and 27 test
              # modules import `benchmarks` while 6 exercise `scripts/`
              # via importlib. Omitting them meant a PR touching only
              # those directories took the `echo` branch below and
              # reported a passing `pytest (3.12)`/`(3.13)` — both
              # required checks — having run no tests at all (#1160).
              - 'benchmarks/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
      - if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        run: uv sync --frozen --group dev --extra archive
      # The uninstall `--archive` tests guard themselves with
      # `pytest.importorskip("cryptography")` (#1529), so a CI job that lost the
      # `[archive]` extra would report green while silently skipping six tests
      # instead of failing. `cryptography` importing is the guards' only
      # condition, so asserting it here proves none of them can skip.
      - if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        name: The [archive] extra must be present, or the archive tests skip
        run: uv run python -c "import cryptography"
      # The interpreter, SQLite and runner image a leg actually used, so a
      # failure on one leg can be compared against a green one without
      # re-running it. uv can resolve the image's own Python as well as a
      # managed one, so the log reads them rather than assuming.
      - if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        name: Log the interpreter, SQLite and runner image
        run: |
          uv run python - <<'PY'
          import os
          import sqlite3
          import sys
          print("sys.version:", sys.version)
          print("sys.executable:", sys.executable)
          print("sqlite3.sqlite_version:", sqlite3.sqlite_version)
          print("ImageOS:", os.environ.get("ImageOS", "<unset>"))
          print("ImageVersion:", os.environ.get("ImageVersion", "<unset>"))
          PY
      # `-rfEsxX` lists every failure, error, skip, xfail and xpass in the
      # summary, skips with their reason, so a skip that hides a missing
      # dependency shows in the log. `--durations=25` names the slowest tests
      # against the job's timeout. The upload step below keeps the JUnit file.
      - if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        run: uv run pytest tests/ --ignore=tests/e2e -q -rfEsxX --durations=25 --junitxml=junit-${{ matrix.python-version }}.xml
      - if: steps.filter.outputs.code != 'true' && github.event_name != 'workflow_dispatch'
        run: echo "No code paths changed; reporting pass for docs-only PR."
      # `always()` so a red leg still keeps its report, which is the case the
      # report is for. On the docs-only branch there is no file, and the
      # action warns rather than fails.
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-${{ matrix.python-version }}-${{ github.sha }}
          path: junit-${{ matrix.python-version }}.xml
          retention-days: 30

  # #1469 — the store-free half of the published-figure gate. Runs the
  # producers named in `<!-- derived: ... -->` markers and hard-fails on any
  # difference between what a producer emits and what the prose published.
  #
  # Its own job rather than a step on `pytest`, for two reasons. `pytest` is
  # matrix'd and path-gated, so a CHANGELOG-only PR takes the `echo` branch —
  # and a PR that changes only the CHANGELOG is precisely the one that ships a
  # figure. And the gate must never report a pass it did not run: no
  # `paths-filter` here, no conditional steps, so the check is either green
  # because it ran or red (#1160).
  #
  # Store-backed producers are not executed. They read a real belief store, a
  # public runner has none, and the lab corpus does not go there (#1456);
  # running them would fail for a reason that has nothing to do with the
  # figure, and the gate would be switched off within a week.
  derived-figures:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen --group dev
      - run: uv run python scripts/check_derived_figures.py --mode all --github

  # Every code path that can write `beliefs.alpha` / `beliefs.beta` must be
  # declared (#1592 AC2). #1359 is why this is a job and not a document: that
  # enumeration surfaced a new unguarded writer every review round, because
  # nothing in the tree stopped one being added between rounds.
  #
  # Pure AST over `src/`, so it needs no store and no corpus — unlike the
  # store-backed producers above, it really can run on a public runner.
  # No `paths-filter` and no conditional step, for the #1160 reason: a gate
  # must never report a pass it did not run.
  posterior-writers:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen --group dev
      - run: uv run python scripts/check_posterior_writers.py

  # #1786 shape A: the per-PR test outcome record. Turns the JUnit reports
  # the two `pytest` legs upload into one record of every test's outcome
  # (passed, failed, error, skipped, xfailed, xpassed, or never executed for
  # the perf and bench-gate tests that skip by design), finds the record of
  # the last green run on main, and writes the diff to the step summary. A
  # test that moves to skipped, xfailed or never executed, or arrives new
  # with one of those, is a ratchet violation.
  #
  # Advisory, by the 2026-10-21 ruling: a violation is a `::warning::`, the
  # diff step passes no `--block`, and job-level `continue-on-error` keeps
  # the check-run `success`, so the merge train's "nothing failing" test
  # holds whatever the diff says. The blocking form is the same job with
  # `--block` on the diff step and without `continue-on-error`.
  # `.github/test-outcome-allowlist.txt` names the tests the ratchet leaves
  # alone.
  #
  # The baseline. This workflow runs on `pull_request` only, so no run is
  # "on main". The train fast-forwards, so a merged PR's head commit is the
  # commit on main and the run that tested it has that commit as its
  # `head_sha`. The script walks main back from the PR's base commit through
  # the runs API and takes the first commit with a green run that still
  # holds a JUnit artifact. The artifact name carries `github.sha`, the
  # merge commit of the PR, which never lands on main, so the lookup matches
  # the `junit-<leg>-` prefix only. Artifacts expire after 30 days; when the
  # walk finds none, or the base is a docs-only PR chain with no report,
  # the summary says "no baseline" and the job stays green. Shape B's
  # nightly on main will write records to a `test-results` branch, which
  # then replaces this walk as the baseline source.
  test-outcomes:
    needs: pytest
    # `!cancelled()` so a red leg still gets its record: the diff of a
    # failing run is the one that explains what changed. Not `always()`,
    # which would still start this job after `concurrency` cancels the run
    # for a newer push. Not guarded to `pull_request`: a dispatched run must
    # emit a real row under this name, not a `skipped` one (#1436 AC5,
    # tests/test_ci_manual_dispatch.py). A dispatch carries no base commit,
    # so its summary says "no baseline".
    if: ${{ !cancelled() }}
    # Job-level, as in mutation.yml: the property needed is that the job's
    # check-run conclusion is `success` when a step fails.
    continue-on-error: true
    runs-on: ubuntu-latest
    # Three API walks and two small downloads; a green run takes under two
    # minutes.
    timeout-minutes: 10
    permissions:
      contents: read
      # Listing another run's artifacts and downloading them.
      actions: read
    # No harden-runner: by the 2026-10-21 ruling it goes only on jobs that
    # hold a write token or a secret, and this job holds neither.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # The two legs' reports from this run. `pattern` with no match is not
      # an error in v4 (a docs-only PR uploads none), and `merge-multiple`
      # puts `junit-3.12.xml` and `junit-3.13.xml` side by side.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: junit-*-${{ github.sha }}
          merge-multiple: true
          path: current
      # The script is standard library only and runs on the image's own
      # python3, so the job does not pay for `uv sync`. A test pins that.
      - name: Build this run's record
        env:
          # On a dispatch the first field is empty and `github.sha` is the
          # tested commit (#1436).
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/test_outcome_record.py record \
              --junit 3.12=current/junit-3.12.xml \
              --junit 3.13=current/junit-3.13.xml \
              --sha "$HEAD_SHA" --out current-record.json
      - name: Find the last green record on main
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # An empty base is a dispatch; the script then writes the no-baseline
        # marker without calling the API, and the notice says why.
        run: |
          if [ -z "${BASE_SHA}" ]; then
              echo "::notice::${GITHUB_EVENT_NAME} run: no base commit, so no baseline"
          fi
          python3 scripts/test_outcome_record.py baseline \
              --repo "$GITHUB_REPOSITORY" --base-sha "$BASE_SHA" \
              --out baseline-record.json
      - name: Diff against the baseline
        run: |
          python3 scripts/test_outcome_record.py diff \
              --current current-record.json --baseline baseline-record.json \
              --allowlist .github/test-outcome-allowlist.txt \
              --summary "$GITHUB_STEP_SUMMARY"
      # Both records, so a reader can rerun the diff and shape B can reuse
      # the format. Named by `github.sha` like the JUnit artifacts.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-outcome-record-${{ github.sha }}
          path: |
            current-record.json
            baseline-record.json
          retention-days: 30
