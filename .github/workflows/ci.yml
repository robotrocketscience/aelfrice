name: CI

on:
  pull_request:
    branches: [main]
    # No paths-ignore: the workflow must always run so the
    # `pytest (3.12)` and `pytest (3.13)` required status checks
    # report on every PR — including docs-only ones. Path detection
    # happens inside the job via `dorny/paths-filter`. `tree_reads`
    # carries `**`, because two tests read every tracked file, so a PR
    # that matches `tree_reads` and not `code`, such as a docs-only one,
    # installs and runs only the tests that read every file a glob
    # matches. A PR that matches neither filter key, `code` or
    # `tree_reads`, which takes a diff that names no file, skips the
    # install and test steps and reports success.
    # Per #413/#427 follow-up: replaces the previous `paths-ignore`
    # filter that silently dropped the pytest check on docs-only PRs
    # and blocked them under `required_status_checks`.
  # #1436 — manual escape hatch. `workflow_dispatch` is delivered through the
  # REST API (`POST .../workflows/{id}/dispatches`), not the webhook path that
  # carries `pull_request` events, so it still fires when delivery is degraded
  # and a PR would otherwise be permanently unmergeable.
  #
  # Deliberately NO `ref` input. The built-in dispatch ref is the targeting
  # mechanism, and it is also the safety property (#1436 AC5): a run's
  # check-runs attach to the head SHA of the ref it was dispatched on, and
  # merge-train reads `commits/${HEAD_SHA}/check-runs`. So a dispatch can only
  # ever report against the commit it actually tested. A `ref` *input* would
  # break exactly that — checkout would test one ref while the check-runs
  # landed on another, which is a way to skip the gate rather than re-run it.
  workflow_dispatch:

permissions:
  contents: read

env:
  # #1472. tests/conftest.py scales every pytest-timeout budget by this
  # factor so a loaded developer machine does not lose tests that have no
  # defect. CI runs on a dedicated runner and wants the unscaled budgets:
  # a 4x-looser timeout is 4x longer to notice a hang. The `pytest` job
  # below has a 30-minute `timeout-minutes` backstop for the whole leg.
  #
  # Pinned per workflow, and not inferred from `CI` being set: `CI` is
  # commonly exported in local shells, so the implicit form would change
  # local behaviour silently. tests/test_timeout_scale_1472.py asserts
  # every one of these five files carries this line.
  AELF_TEST_TIMEOUT_SCALE: "1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    # Pinned image rather than `ubuntu-latest`: a label move can change the
    # system Python and SQLite a leg resolves, under a required check, with
    # no commit to point at. `derived-figures` carries the same pin, since
    # these legs fail unless it passed. The other jobs here keep
    # `ubuntu-latest`.
    runs-on: ubuntu-24.04
    # A hung leg is cancelled at 30 minutes instead of the platform's
    # 360. Recent green legs took 11 to 14 minutes. The wait for
    # `derived-figures` comes before the leg starts and does not count
    # toward these 30 minutes. That job's own `timeout-minutes` bounds it.
    timeout-minutes: 30
    # The branch ruleset requires the two `pytest` legs and not
    # `derived-figures`, so the legs carry that job's result: each leg waits
    # for it and fails in its first step, before checkout, unless it
    # passed. A merge through the UI, `gh pr merge` or
    # auto-merge then cannot land a red figure.
    # `!cancelled()` runs the legs after a failed `derived-figures`. Without
    # it they report `skipped`, and the ruleset counts a skipped check as a
    # pass.
    needs: derived-figures
    if: ${{ !cancelled() }}
    strategy:
      # One leg failing must not cancel the other: a 3.12-only failure and
      # a failure on both versions are different diagnoses.
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      # No `if:`, so a docs-only PR fails here too. `needs` reports
      # `success`, `failure`, `cancelled` or `skipped`, and only `success`
      # passes. `derived-figures` is a matrix job with one job ID, so this
      # reads one result for all its legs, and it is `success` only when
      # every leg passed.
      - name: The derived-figures job must pass
        env:
          DERIVED_FIGURES: ${{ needs.derived-figures.result }}
        run: test "$DERIVED_FIGURES" = success
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # Path detection is a pull_request-only optimisation. A manual dispatch
      # is fired precisely when someone needs this check to report, so it runs
      # the suite unconditionally rather than inferring "no code changed" from
      # a diff base that a dispatch does not carry. Erring toward running is
      # the #1160 lesson: a skipped job must never report a pass that looks
      # like a run.
      - if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              # `pythonpath = ["."]` in pyproject.toml makes these two
              # top-level packages importable from the suite, and 27 test
              # modules import `benchmarks` while 6 exercise `scripts/`
              # via importlib. Omitting them meant a PR touching only
              # those directories took the `echo` branch below and
              # reported a passing `pytest (3.12)`/`(3.13)` — both
              # required checks — having run no tests at all (#1160).
              - 'benchmarks/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              # Tests read the merge-train, mutation, publish and
              # staging-gate workflows as well as this file, so a change
              # to any of them runs the suite (#1786 CI-07).
              - '.github/**'
              # Files outside the directories above that a test opens,
              # one exact entry per file. A PR that changed only one of
              # these took the `echo` branch and reported a pass without
              # running the test that reads it (#1786 CI-07). The list is
              # derived, not maintained: tests/test_ci_path_filter.py
              # resolves the repo paths tests/ builds, fails on one it
              # cannot resolve unless its line declares what it reads in a
              # `# path-filter:` comment, and fails when a file read there
              # is missing here or an entry here is read by no test.
              # `docs/**` and `CHANGELOG/**` stay out on purpose, so a PR
              # that touches no listed file still skips the suite
              # (#413/#427).
              - '.githooks/pre-push'
              - '.gitignore'
              - 'CHANGELOG.md'
              - 'CHANGELOG/unreleased/README.md'
              - 'CHANGELOG/v4.md'
              - 'CONTRIBUTING.md'
              - 'README.md'
              - 'SECURITY.md'
              - 'docs/concepts/ARCHITECTURE.md'
              - 'docs/concepts/RELEASING.md'
              - 'docs/concepts/ROADMAP.md'
              - 'docs/design/budget_discriminability_k0_result.md'
              - 'docs/design/derived_figure_markers.md'
              - 'docs/design/testing-strategy.md'
              - 'docs/user/COMMANDS.md'
              - 'docs/user/CONFIG.md'
              - 'docs/user/INSTALL.md'
              - 'docs/user/LIMITATIONS.md'
              - 'docs/user/PRIVACY.md'
              - 'docs/user/QUICKSTART.md'
              - 'docs/user/SLASH_COMMANDS.md'
              - 'pyright_baseline.json'
            # Globs that a test reads every match of, declared in its
            # `# path-filter:` comment: the privacy and conflict-marker
            # scans read every tracked file through `git ls-files`, which
            # `**` matches, the cross-file anchor test reads each tracked
            # Markdown file, and the derived-figure tests read every
            # Markdown and Python file under docs/ and CHANGELOG/ through
            # `iter_files`. No list of exact entries can cover
            # that, and these globs under `code` would put the full matrix
            # on every docs-only PR. A PR that matches this key and not
            # `code` runs only the modules that declare a glob, and those
            # that read a CHANGELOG directory, in the step after the suite.
            # `code` leaves those directories out by ruling (#413/#427),
            # and `**/*.md` matches every file in them.
            # tests/test_ci_path_filter.py derives this list from the
            # comments and that step's modules from the comments and the
            # directories the suite reads.
            tree_reads:
              - '**'
              - '**/*.md'
              - 'CHANGELOG/**/*.py'
              - 'docs/**/*.py'
      - if: steps.filter.outputs.code == 'true' || steps.filter.outputs.tree_reads == 'true' || github.event_name == 'workflow_dispatch'
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - if: steps.filter.outputs.code == 'true' || steps.filter.outputs.tree_reads == 'true' || github.event_name == 'workflow_dispatch'
        run: uv sync --frozen --group dev --extra archive
      # The uninstall `--archive` tests guard themselves with
      # `pytest.importorskip("cryptography")` (#1529), so a CI job that lost the
      # `[archive]` extra would report green while silently skipping six tests
      # instead of failing. `cryptography` importing is the guards' only
      # condition, so asserting it here proves none of them can skip.
      - if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        name: The [archive] extra must be present, or the archive tests skip
        run: uv run python -c "import cryptography"
      # The interpreter, SQLite and runner image a leg actually used, so a
      # failure on one leg can be compared against a green one without
      # re-running it. uv can resolve the image's own Python as well as a
      # managed one, so the log reads them rather than assuming.
      - if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        name: Log the interpreter, SQLite and runner image
        run: |
          uv run python - <<'PY'
          import os
          import sqlite3
          import sys
          print("sys.version:", sys.version)
          print("sys.executable:", sys.executable)
          print("sqlite3.sqlite_version:", sqlite3.sqlite_version)
          print("ImageOS:", os.environ.get("ImageOS", "<unset>"))
          print("ImageVersion:", os.environ.get("ImageVersion", "<unset>"))
          PY
      # `-rfEsxX` lists every failure, error, skip, xfail and xpass in the
      # summary, skips with their reason, so a skip that hides a missing
      # dependency shows in the log. `--durations=25` names the slowest tests
      # against the job's timeout. The upload step below keeps the JUnit file.
      #
      # `--deselect` drops the one test that re-runs the store-free producers
      # over the live tree. The `derived-figures` job below runs the same
      # producers over the same tree on every PR, with no path filter, on the
      # same Python versions as these legs, so each leg ran the producers a
      # second time. The branch ruleset does not require that job, so the
      # first step fails unless every leg of it passed, and a red producer
      # check still turns both required legs red. That job
      # passes `--producer-timeout 120`, the 120 s the test's timeout marker
      # sets, so a producer still running at 120 s fails it. The marker timed
      # the text scan and the producers together. The flag times each
      # producer, and up to eight of them start at once. The test still runs
      # locally.
      # tests/test_ci_pytest_job_hygiene.py ties the deselect to that job.
      - if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        run: uv run pytest tests/ --ignore=tests/e2e -q -rfEsxX --durations=25 --deselect tests/test_derived_figures_1469.py::test_the_repo_passes_the_producer_checks --junitxml=junit-${{ matrix.python-version }}.xml
      # A PR that matches `tree_reads` and no `code` path runs the modules
      # that read every match of a glob or a CHANGELOG directory, not the
      # whole suite. No JUnit report: a partial run is not a record of the
      # suite. It carries the full suite's `--deselect`: `derived-figures`
      # runs the producers on this PR as on any other, and these legs
      # still fail unless it passed.
      - if: steps.filter.outputs.code != 'true' && steps.filter.outputs.tree_reads == 'true' && github.event_name != 'workflow_dispatch'
        name: Run the tests that read every file a glob matches
        run: uv run pytest tests/test_changelog_dupes.py tests/test_code_span_scanner_1556.py tests/test_codex_option_rejection_1429.py tests/test_collate_changelog.py tests/test_conflict_markers_1491.py tests/test_derived_figures_1469.py tests/test_docs_cross_file_anchors_1511.py tests/test_no_personal_paths.py tests/test_store_open_cost_1561.py --deselect tests/test_derived_figures_1469.py::test_the_repo_passes_the_producer_checks -q -rfEsxX
      - if: steps.filter.outputs.code != 'true' && steps.filter.outputs.tree_reads != 'true' && github.event_name != 'workflow_dispatch'
        run: echo "No changed file matched a filter key; reporting pass."
      # `always()` so a red leg still keeps its report, which is the case the
      # report is for. On the docs-only branch there is no file, and the
      # action warns rather than fails.
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-${{ matrix.python-version }}-${{ github.sha }}
          path: junit-${{ matrix.python-version }}.xml
          retention-days: 30

  # #1469 — the store-free half of the published-figure gate. Runs the
  # producers named in `<!-- derived: ... -->` markers and hard-fails on any
  # difference between what a producer emits and what the prose published.
  #
  # Its own job rather than a step on `pytest`, for two reasons. `pytest` is
  # path-gated, so a CHANGELOG-only PR runs only the `tree_reads` modules,
  # and a PR that changes only the CHANGELOG is precisely the one that ships a
  # figure. And the gate must never report a pass it did not run: no
  # `paths-filter` here, no conditional steps, so the check is either green
  # because it ran or red (#1160).
  #
  # Store-backed producers are not executed. They read a real belief store, a
  # public runner has none, and the lab corpus does not go there (#1456);
  # running them would fail for a reason that has nothing to do with the
  # figure, and the gate would be switched off within a week.
  #
  # The matrix is the `pytest` legs' matrix, because those legs deselect the
  # producer check and this job runs it for them. The legs report as
  # `derived-figures (3.12)` and `derived-figures (3.13)`, the names
  # `FLOOR_NAMES` in scripts/merge_train_gate.py lists.
  # `--producer-timeout 120` holds each producer to the 120 s the deselected
  # test's timeout marker sets.
  #
  # The image is the `pytest` legs' pinned image. The legs fail unless this
  # job passed, so a label move here would turn both required checks red
  # with no commit to point at.
  derived-figures:
    runs-on: ubuntu-24.04
    # The `pytest` legs wait for this job, so a hang here holds both
    # required checks pending until this cap, or the platform's 360
    # minutes without one. The producer cap does not bound the text scan
    # or the setup steps. Recent green runs took 45 to 72 seconds.
    timeout-minutes: 10
    strategy:
      # One leg failing must not cancel the other, as on the `pytest` legs.
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen --group dev
      - run: uv run python scripts/check_derived_figures.py --mode all --github --producer-timeout 120

  # Every code path that can write `beliefs.alpha` / `beliefs.beta` must be
  # declared (#1592 AC2). #1359 is why this is a job and not a document: that
  # enumeration surfaced a new unguarded writer every review round, because
  # nothing in the tree stopped one being added between rounds.
  #
  # Pure AST over `src/`, so it needs no store and no corpus — unlike the
  # store-backed producers above, it really can run on a public runner.
  # No `paths-filter` and no conditional step, for the #1160 reason: a gate
  # must never report a pass it did not run.
  posterior-writers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen --group dev
      - run: uv run python scripts/check_posterior_writers.py

  # #1786 shape A: the per-PR test outcome record. Turns the JUnit reports
  # the two `pytest` legs upload into one record of every test's outcome
  # (passed, failed, error, skipped, xfailed, xpassed, or never executed for
  # the perf and bench-gate tests that skip by design), finds the record of
  # the last green run on main, and writes the diff to the step summary. A
  # test that moves to skipped, xfailed or never executed, or arrives new
  # with one of those, is a ratchet violation.
  #
  # Advisory, by the 2026-10-21 ruling: a violation is a `::warning::`, the
  # diff step passes no `--block`, and every step carries `continue-on-error`,
  # so the job's check-run is `success` when a step fails and the merge
  # train's "nothing failing" test holds whatever the diff says. A job-level
  # `continue-on-error` alone would not do that: it keeps the workflow run
  # green, but the job's check-run still reads `failure`, and the train
  # gates on check-runs. The blocking form is the same job with `--block` on
  # the diff step and without `continue-on-error` on that step.
  # `.github/test-outcome-allowlist.txt` names the tests the ratchet leaves
  # alone.
  #
  # The baseline. This workflow runs on `pull_request` and on
  # `workflow_dispatch`, never on a push to main. The train fast-forwards,
  # so a merged PR's head commit is the commit on main and the run that
  # tested it has that commit as its `head_sha`; a dispatched run has the
  # commit it tested as its `head_sha`. The script walks main back from the
  # PR's base commit through the runs API and takes the first commit with a
  # green run of either event that still holds a JUnit artifact. The
  # artifact name carries `github.sha`: on a PR run the merge commit of the
  # PR, which never lands on main, and on a dispatch the tested commit, so
  # the lookup matches the `junit-<leg>-` prefix only. Artifacts expire after 30 days; when the
  # walk finds none, or the base is a docs-only PR chain with no report,
  # the summary says "no baseline" and the job stays green. Shape B's
  # nightly on main will write records to a `test-results` branch, which
  # then replaces this walk as the baseline source.
  test-outcomes:
    needs: pytest
    # `!cancelled()` so a red leg still gets its record: the diff of a
    # failing run is the one that explains what changed. Not `always()`,
    # which would still start this job after `concurrency` cancels the run
    # for a newer push. Not guarded to `pull_request`: a dispatched run must
    # emit a real row under this name, not a `skipped` one (#1436 AC5,
    # tests/test_ci_manual_dispatch.py). A dispatch carries no base commit,
    # so its summary says "no baseline".
    if: ${{ !cancelled() }}
    # Job-level, for the workflow run only: a failed job then leaves the run
    # `success`, so the baseline walk, which reads only successful runs, can
    # still take this commit. The step-level lines below keep the check-run
    # off `failure`; this one does not.
    continue-on-error: true
    runs-on: ubuntu-latest
    # Three API walks and two small downloads; a green run takes under two
    # minutes. A job that reaches this cap ends `cancelled`, and so does the
    # run, whatever `continue-on-error` says: mutation.yml's 60-minute
    # timeouts on runs 41401037793 and 39564214136 ended that way. The
    # baseline walk then skips the commit. So every step carries its own
    # `timeout-minutes`, and the steps' caps add up to less than this one.
    # A step past its cap ends `failure`, its `continue-on-error` turns that
    # into `success` (`ApplyContinueOnError` in actions/runner,
    # src/Runner.Worker/ExecutionContext.cs), and the run stays `success`.
    timeout-minutes: 15
    permissions:
      contents: read
      # Listing another run's artifacts and downloading them.
      actions: read
    # No harden-runner: by the 2026-10-21 ruling it goes only on jobs that
    # hold a write token or a secret, and this job holds neither.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        continue-on-error: true
        timeout-minutes: 1
        with:
          persist-credentials: false
      # The two legs' reports from this run. `pattern` with no match is not
      # an error in v4 (a docs-only PR uploads none), and `merge-multiple`
      # puts `junit-3.12.xml` and `junit-3.13.xml` side by side.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        timeout-minutes: 1
        with:
          pattern: junit-*-${{ github.sha }}
          merge-multiple: true
          path: current
      # The script is standard library only and runs on the image's own
      # python3, so the job does not pay for `uv sync`. A test pins that.
      - name: Build this run's record
        continue-on-error: true
        timeout-minutes: 1
        env:
          # On a dispatch the first field is empty and `github.sha` is the
          # tested commit (#1436).
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/test_outcome_record.py record \
              --junit 3.12=current/junit-3.12.xml \
              --junit 3.13=current/junit-3.13.xml \
              --sha "$HEAD_SHA" --out current-record.json
      - name: Find the last green record on main
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # An empty base is a dispatch; the script then writes the no-baseline
        # marker without calling the API, and the notice says why.
        run: |
          if [ -z "${BASE_SHA}" ]; then
              echo "::notice::${GITHUB_EVENT_NAME} run: no base commit, so no baseline"
          fi
          python3 scripts/test_outcome_record.py baseline \
              --repo "$GITHUB_REPOSITORY" --base-sha "$BASE_SHA" \
              --out baseline-record.json
      - name: Diff against the baseline
        continue-on-error: true
        timeout-minutes: 1
        run: |
          python3 scripts/test_outcome_record.py diff \
              --current current-record.json --baseline baseline-record.json \
              --allowlist .github/test-outcome-allowlist.txt \
              --summary "$GITHUB_STEP_SUMMARY"
      # Both records, so a reader can rerun the diff and shape B can reuse
      # the format. Named by `github.sha` like the JUnit artifacts.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        continue-on-error: true
        timeout-minutes: 1
        with:
          name: test-outcome-record-${{ github.sha }}
          path: |
            current-record.json
            baseline-record.json
          retention-days: 30
