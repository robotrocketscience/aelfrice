name: Staging Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  # #1436 — manual escape hatch for the three required scan contexts
  # (`secrets-scan`, `pattern-scan`, `history-scan`). See the matching note in
  # ci.yml for why there is no `ref` input: the dispatch ref is both the
  # targeting mechanism and the AC5 safety property.
  #
  # Every job in this file must genuinely RUN on a dispatch. `history-scan`,
  # `release-docs-check` and `commit-msg-prefix` fall back to the repository
  # default branch as their diff base, which reproduces the PR range exactly
  # when the dispatch ref is the PR head.
  #
  # No job here may be guarded to `pull_request` only. A guarded job still
  # emits a check-run, with conclusion `skipped` and a *later* `started_at` —
  # and `merge_train_gate.latest_per_name` keeps the newest run per name while
  # `skipped` is not in `FAILING_CONCLUSIONS`. So a skipped row overwrites an
  # earlier real `failure` and flips the gate green: a dispatch would become a
  # way to clear a red check, which is exactly what #1436 AC5 forbids. The two
  # jobs that could only ever run on a pull request (`pr-title-prefix`,
  # `pr-body-issue-link`) moved to `pr-metadata.yml`, which has no
  # `workflow_dispatch`, so the mechanism is gone rather than documented around.
  # `tests/test_ci_manual_dispatch.py` pins that no job here regains such a guard.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  pattern-scan:
    # Skip on dependabot PRs: GitHub does not pass repository Actions secrets
    # to dependabot-triggered runs (supply-chain protection), so SCAN_RULES_B64
    # is empty and this job has no patterns to scan against. Dependabot diffs
    # only touch dependency manifests (pyproject.toml / uv.lock), which carry
    # no PII vector worth gating on. Other staging-gate jobs (secrets-scan,
    # history-scan, commit-msg-prefix, release-docs-check) still run and
    # provide the actual security gates for dep updates.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
      - uses: actions/checkout@v4
      - name: Decode patterns
        env:
          PATTERNS: ${{ secrets.SCAN_RULES_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${PATTERNS:-}" ]; then
            echo "::error::SCAN_RULES_B64 not configured"
            exit 1
          fi
          echo "$PATTERNS" | base64 -d > /tmp/p
          [ -s /tmp/p ] || { echo "::error::empty"; exit 1; }
      - name: Scan tracked files
        run: |
          set -euo pipefail
          mapfile -t EXEMPT < <(grep -vE '^(#|$)' .github-pii-exempt 2>/dev/null || true)
          mapfile -t FILES < <(git ls-files | while read -r f; do
            skip=0
            for pat in "${EXEMPT[@]:-}"; do
              [ -z "$pat" ] && continue
              [[ "$f" == $pat ]] && { skip=1; break; }
            done
            [ "$skip" -eq 0 ] && echo "$f"
          done)
          fail=0
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            [[ "$p" =~ ^# ]] && continue
            if matches=$(grep -EHnI "$p" "${FILES[@]}" 2>/dev/null); then
              echo "::error::pattern hit"
              echo "$matches"
              fail=1
            fi
          done < /tmp/p
          rm -f /tmp/p
          exit "$fail"

  history-scan:
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch base ref
        run: |
          git fetch --no-tags origin "$BASE_REF"
      - name: Decode patterns
        env:
          PATTERNS: ${{ secrets.SCAN_RULES_B64 }}
        run: |
          set -euo pipefail
          echo "$PATTERNS" | base64 -d > /tmp/p
      - name: Scan PR-incoming history
        run: |
          set -euo pipefail
          # Discretion is a property of incoming changes, not of code that
          # already shipped to main. Scope the scan to commits this PR adds
          # on top of the merge base, so a legitimate identifier merged via
          # an earlier PR cannot retroactively block every subsequent PR.
          merge_base="$(git merge-base "origin/${BASE_REF}" "$HEAD_SHA")"
          range="${merge_base}..${HEAD_SHA}"
          git log "$range" --format='%H%n%an%n%ae%n%cn%n%ce%n%s%n%b' > /tmp/h
          git log "$range" -p > /tmp/d
          fail=0
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            [[ "$p" =~ ^# ]] && continue
            if grep -El "$p" /tmp/h /tmp/d >/dev/null; then
              echo "::error::pattern hit in history"
              fail=1
            fi
          done < /tmp/p
          rm -f /tmp/p /tmp/h /tmp/d
          exit "$fail"

  release-docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # #1211 — runs on every PR, deliberately ahead of the release-only
      # early exit below. Resolving a CHANGELOG conflict insert-only is
      # right for added entries and wrong for amended ones: it leaves the
      # superseded revision beside the one that replaced it. Catching that
      # at release time would be catching it after every intervening PR
      # has rebased on top of it.
      - name: CHANGELOG entries are distinct
        run: python3 scripts/check_changelog_dupes.py CHANGELOG/*.md CHANGELOG.md
      # #1491 — also every-PR, and repo-wide rather than changelog-shaped.
      # Markers reached main in CHANGELOG/v4.md and, in the #1362/#1378
      # rebase, in a design doc; a guard scoped to whichever file was hit
      # last is a guard for the previous incident. pytest asserts the same
      # thing, but this reports it as a file annotation on the offending
      # line rather than as a test failure the author has to locate.
      - name: No merge-conflict markers are committed
        run: python3 scripts/check_conflict_markers.py
      - name: Detect release PR and verify docs
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          extract_version() {
            grep -m1 -E '^version[[:space:]]*=' "$1" | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/'
          }
          head_ver="$(extract_version pyproject.toml)"
          git fetch --no-tags origin "$BASE_REF" --depth=1
          git show "origin/${BASE_REF}:pyproject.toml" > /tmp/base_pyproject.toml
          base_ver="$(extract_version /tmp/base_pyproject.toml)"
          if [ "$head_ver" = "$base_ver" ]; then
            echo "Not a release PR (version unchanged: ${head_ver}). Skipping docs check."
            exit 0
          fi
          echo "Release PR detected: ${base_ver} -> ${head_ver}"
          fail=0
          # CHANGELOG.md is a thin index; per-major release content lives in CHANGELOG/vN.md
          major="${head_ver%%.*}"
          changelog_file="CHANGELOG/v${major}.md"
          if [ ! -f "$changelog_file" ]; then
            echo "::error file=CHANGELOG.md::Missing ${changelog_file} for v${head_ver}. Create it and add the [${head_ver}] section there."
            fail=1
          else
            if ! grep -qE "^## \[${head_ver}\]" "$changelog_file"; then
              echo "::error file=${changelog_file}::Missing '## [${head_ver}]' section. Move [Unreleased] entries into a dated [${head_ver}] block in this file."
              fail=1
            fi
            if ! grep -qE "^\[${head_ver}\]:\s*https://github.com/" "$changelog_file"; then
              echo "::error file=${changelog_file}::Missing compare-link footnote '[${head_ver}]: https://github.com/...' near bottom of this file."
              fail=1
            fi
            # #837 — [Unreleased] must be drained on release. Between the
            # `## [Unreleased]` header and the next `## [` header, only
            # `### ...` subsection headers and whitespace may remain.
            # Any bullet / paragraph content = entries that should have
            # moved into the dated section (per top-level CHANGELOG.md
            # policy: "On release, move [Unreleased] content into a
            # dated ## [X.Y.Z] section"). Catches SemVer breaks like a
            # patch release shipping breaking changes left in
            # [Unreleased] (the original failure mode that motivated this
            # check: PR #835 review thread).
            unreleased_body=$(awk '
              /^## \[Unreleased\]/ { in_unreleased=1; next }
              /^## \[/ && in_unreleased { exit }
              in_unreleased && NF > 0 && !/^###/ { print }
            ' "$changelog_file")
            if [ -n "$unreleased_body" ]; then
              echo "::error file=${changelog_file}::Release PR detected (${base_ver} -> ${head_ver}) but [Unreleased] still contains content. Migrate it into [${head_ver}] (or split the unmigrated entries into a follow-up release) before merging."
              echo "Offending [Unreleased] content (first 20 lines):"
              printf '%s\n' "$unreleased_body" | head -20 | sed 's/^/  /'
              fail=1
            fi
          fi
          if grep -qE "v?${head_ver}\s*\|\s*(next|planned)\b" README.md; then
            echo "::error file=README.md::Roadmap row for v${head_ver} still says 'next' or 'planned'. Flip status to 'shipped' before cutting the release."
            fail=1
          fi
          if [ -f docs/concepts/ROADMAP.md ] && ! grep -qE "v${head_ver}" docs/concepts/ROADMAP.md; then
            echo "::warning file=docs/concepts/ROADMAP.md::No mention of v${head_ver}. Consider adding a section (non-blocking)."
          fi
          exit "$fail"

  # ---------------------------------------------------------------------------
  # #169 — Conventional-commit prefix enforcement
  #
  # Validates that every commit in the PR (base..head) starts with an allowed
  # conventional-commit prefix.  The check is delegated entirely to
  # scripts/check-commit-msg.py so the prefix list stays in one place.
  #
  # Exempt subjects (handled inside the script):
  #   - "Merge ..."  — git-generated merge commits
  #   - "Revert ..." — git-generated revert commits
  #
  # This job fails the PR if any commit has an invalid prefix.
  # ---------------------------------------------------------------------------
  commit-msg-prefix:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate commit-message prefixes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # #1436 — a workflow_dispatch run carries no pull_request payload, so
          # both SHAs arrive empty and `"${BASE_SHA}..${HEAD_SHA}"` would
          # degenerate to `..` (HEAD..HEAD, an empty range) and pass having
          # validated nothing. Reconstruct the same range the PR event supplies:
          # merge-base of the default branch and the dispatched head.
          if [ -z "${HEAD_SHA}" ]; then
            HEAD_SHA="$(git rev-parse HEAD)"
          fi
          if [ -z "${BASE_SHA}" ]; then
            git fetch --no-tags origin "${BASE_REF}"
            BASE_SHA="$(git merge-base "origin/${BASE_REF}" "${HEAD_SHA}")"
          fi
          fail=0
          while IFS= read -r sha; do
            subject="$(git log -1 --format='%s' "$sha")"
            if ! python3 scripts/check-commit-msg.py --subject "$subject"; then
              echo "::error::Bad commit prefix in $sha: $subject"
              fail=1
            fi
          done < <(git log --format='%H' "${BASE_SHA}..${HEAD_SHA}")
          if [ "$fail" -eq 0 ]; then
            echo "All commit subjects have valid conventional-commit prefixes."
          fi
          exit "$fail"
