name: merge-train

# #602 — label-driven serialized merger for parallel-session work.
# When a PR is labeled `ready-to-merge`, the workflow attempts to
# fast-forward `main` to the PR's head. Concurrency-1 means only one
# merge is ever in flight, eliminating the merge-thrash described in
# #602 (where overlapping rebases get invalidated faster than CI can
# re-run).
#
# Hard constraint: this workflow runs as `github-actions[bot]`, which
# has no signing key. The `required_signatures` rule on `main` rejects
# any commit it adds. So the bot cannot rebase — it can only FF.
# If a PR is behind main when its turn comes up, the bot unlabels and
# asks the author to rebase and re-label. Under serialization, main
# moves only when the bot is merging, so a freshly-rebased author who
# labels promptly will be FF when their slot is processed.
#
# See `.github/workflows/flag-stale-open-prs.yml` for the original
# "no auto-rebase" rationale (#341).

on:
  pull_request:
    # `labeled` catches the operator's initial ready-to-merge add.
    # `synchronize` catches subsequent pushes (rebases) while the label
    # is already attached — without it, a rebased PR's new head SHA is
    # never re-evaluated until the label is manually cycled. See #646.
    types: [labeled, synchronize]

permissions:
  contents: write
  pull-requests: write
  issues: write  # #637: `gh issue close --comment` (#634 auto-close) needs issues:write

# Concurrency-1: this is the whole point. Two labeled events queue
# rather than race.
concurrency:
  group: merge-train
  cancel-in-progress: false

jobs:
  merge:
    # On `labeled`: only fire when *this* event added ready-to-merge.
    # On `synchronize`: only fire when ready-to-merge is *currently* on
    # the PR (i.e. the operator already consented and the rebase is
    # bringing it onto a fresh head SHA). See #646.
    if: |
      (github.event.action == 'labeled' && github.event.label.name == 'ready-to-merge') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'ready-to-merge'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          # Default token is fine for FF pushes — we're advancing main
          # to existing already-signed commits, not adding new ones.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Attempt merge-train FF
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHECK_TIMEOUT_SECONDS: '600'
        run: |
          set -euo pipefail

          fail_and_unlabel() {
              local reason="$1"
              # Use the comment marker so repeat-bumps can be detected
              # / de-duped by anyone reading the PR thread later.
              cat > /tmp/comment.md <<EOF
          <!-- merge-train-v1 -->
          **merge-train: blocked**

          ${reason}

          The \`ready-to-merge\` label has been removed. Address the issue above and re-add the label when you're ready for another attempt.

          If a required check never reported at all — rather than reported red — you can re-run it without pushing (#1436):
          \`gh workflow run ci.yml --ref <branch>\` and \`gh workflow run staging-gate.yml --ref <branch>\`. Dispatch goes over the REST API, not the webhook path, so it still fires when delivery is degraded.

          Those two produce the **required** contexts only. This gate also evaluates every other non-advisory check present on the head, and an absent check satisfies an absence test — so confirm the full set is on the head SHA before re-labelling, rather than treating a successful dispatch as green. See CONTRIBUTING.md § "When a check never reports".
          EOF
              jq -Rs '{body: .}' < /tmp/comment.md > /tmp/payload.json
              gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/comments" \
                  --input /tmp/payload.json >/dev/null
              gh pr edit "${PR_NUMBER}" --remove-label ready-to-merge
              exit 0
          }

          # [0/6] Base check, first because it is the cheapest refusal and
          # because a stacked PR has no required checks to wait for — folding
          # it into the poll loop below would stall to the 30-minute timeout
          # instead of refusing in the first seconds (#1424).
          BASE_REF=$(gh pr view "${PR_NUMBER}" --repo "${REPO}" \
              --json baseRefName --jq .baseRefName || echo "")
          echo "[0/6] base check... resolved base: '${BASE_REF:-<unresolved>}'"
          if ! base_msg=$(python3 scripts/merge_train_gate.py \
                  --base-ref "${BASE_REF}" --default-branch main); then
              fail_and_unlabel "${base_msg}"
          fi
          echo "${base_msg}"

          echo "[1/6] refreshing refs..."
          git fetch origin main "${HEAD_REF}" --quiet

          # Sanity-check the PR head matches what the event reported. If
          # the author force-pushed between the label-fire and now, the
          # bot would FF to a stale commit. Refuse and re-trigger via
          # re-labeling.
          remote_head=$(git rev-parse "origin/${HEAD_REF}")
          if [ "${remote_head}" != "${HEAD_SHA}" ]; then
              fail_and_unlabel "branch head moved during merge-train queue (event=\`${HEAD_SHA}\`, current=\`${remote_head}\`). Re-add \`ready-to-merge\` to retry against the new head."
          fi

          echo "[2/6] FF check..."
          if ! git merge-base --is-ancestor origin/main "origin/${HEAD_REF}"; then
              base=$(git merge-base origin/main "origin/${HEAD_REF}" || echo "unknown")
              head=$(git rev-parse origin/main)
              fail_and_unlabel "branch is not fast-forward on \`main\` (branch base \`${base}\`, current main \`${head}\`). Rebase locally (\`git rebase github/main\`), force-push, and re-add the label."
          fi

          echo "[3/6] conversation-resolution check..."
          # Query the PR's review threads via GraphQL and collect any that are
          # neither resolved nor outdated. Must run before the expensive CI
          # poll so unresolved threads short-circuit cheaply (avoids hitting
          # the push gate with a GH006 rejection after a full 10-minute wait).
          unresolved=$(gh api graphql -F pr="${PR_NUMBER}" -f query='
            query($pr:Int!) {
              repository(owner:"robotrocketscience", name:"aelfrice") {
                pullRequest(number:$pr) {
                  reviewThreads(first:100) {
                    nodes { isResolved isOutdated comments(first:1){nodes{path}} }
                  }
                }
              }
            }' --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved==false and .isOutdated==false) | .comments.nodes[0].path] | unique')

          if [ "${unresolved}" != "[]" ] && [ -n "${unresolved}" ]; then
              paths=$(echo "${unresolved}" | jq -r 'join(", ")')
              count=$(echo "${unresolved}" | jq 'length')
              fail_and_unlabel "${count} review thread(s) are unresolved on these files: ${paths}. Resolve them on the PR (click 'Resolve conversation' on each) and re-add the label."
          fi

          echo "[4/6] signature check on commits being pushed..."
          # Every commit reachable from PR head but not from main must
          # be signed. The bot can't sign, but it isn't adding commits
          # here — these are the author's. Verify upfront so a quiet
          # branch-protection rejection downstream doesn't confuse.
          #
          # Use GitHub's verification API rather than `git log --format=%G?`:
          # %G? requires local `gpg.ssh.allowedSignersFile` to recognise
          # SSH signatures, which actions/checkout does not set. GitHub's
          # API is the same source of truth `required_signatures` branch
          # protection uses downstream, so any commit it reports as
          # verified will also pass the push gate.
          unsigned=""
          while IFS= read -r sha; do
              [ -z "${sha}" ] && continue
              verified=$(gh api "repos/${REPO}/commits/${sha}" \
                  --jq '.commit.verification.verified // false' 2>/dev/null || echo "false")
              if [ "${verified}" != "true" ]; then
                  unsigned="${unsigned}${sha}"$'\n'
              fi
          done < <(git log --format='%H' "origin/main..origin/${HEAD_REF}")
          unsigned=${unsigned%$'\n'}
          if [ -n "${unsigned}" ]; then
              fail_and_unlabel "one or more commits between main and \`${HEAD_REF}\` are not signed (per GitHub verification API):\n\n\`\`\`\n${unsigned}\n\`\`\`\n\nSign them locally and re-add the label. The bot cannot sign on your behalf."
          fi

          echo "[5/6] waiting for required checks to complete..."
          # #1397: advisory bots were de facto merge-blocking, and the
          # failure message called them required. The gate now excludes
          # them BY NAME and keeps gating on every other check-run —
          # gating on the required set alone was tried and rejected in
          # review, because it would demote 19 real checks (including
          # migration-policy-check, whose absence once left stores
          # unopenable) to fix 2 bots.
          #
          # The required set is still resolved at run time, but only to
          # LABEL which failures were required. The decision lives in
          # scripts/merge_train_gate.py so it can be tested —
          # tests/test_merge_train_gate.py asserts both directions.
          gh api "repos/${REPO}/rules/branches/main" > /tmp/rules.json
          deadline=$(( $(date +%s) + CHECK_TIMEOUT_SECONDS ))
          while [ "$(date +%s)" -lt "${deadline}" ]; do
              # --paginate: per_page caps at 100 and this repo's heads already
              # carry up to 37 check-runs. A required context landing on page
              # two would read as `missing` and stall the train to the poll
              # timeout, so every page is fetched. `jq -s` merges the
              # per-page objects rather than `gh --slurp`, which needs a
              # newer gh than the runner image guarantees.
              gh api --paginate \
                  "repos/${REPO}/commits/${HEAD_SHA}/check-runs?per_page=100" \
                  | jq -s '{check_runs: [.[].check_runs[]]}' > /tmp/rollup.json

              # A non-zero exit is a fail-closed abort, never a green
              # light. Two cases reach it: an unreadable payload, and an
              # unresolvable required set. The second aborts because the
              # required set is what `missing` is derived from, and
              # `missing` is the only signal below that is not an
              # absence-test — without it an empty rollup reads as green
              # (#1435).
              if ! verdict=$(python3 scripts/merge_train_gate.py \
                      --rollup /tmp/rollup.json --rules /tmp/rules.json); then
                  fail_and_unlabel "could not resolve the branch's required status checks, so the merge gate refused to decide. This is a fail-closed abort — see the job log."
              fi

              fails=$(echo "${verdict}" | jq -r '.failing | join(", ")')
              if [ -n "${fails}" ]; then
                  req=$(echo "${verdict}" | jq -r '.failing_required | join(", ")')
                  other=$(echo "${verdict}" | jq -r '.failing_not_required | join(", ")')
                  msg="check(s) failed."
                  if [ -n "${req}" ]; then
                      msg="${msg} Required: \`${req}\`."
                  fi
                  if [ -n "${other}" ]; then
                      msg="${msg} Not required by the ruleset but still gating: \`${other}\`."
                  fi
                  fail_and_unlabel "${msg} Fix CI and re-add the label."
              fi

              unmatched=$(echo "${verdict}" | jq -r '.advisory_unmatched | join(", ")')
              if [ -n "${unmatched}" ]; then
                  echo "note: advisory exclusion(s) matched no check-run on this SHA: ${unmatched}"
              fi

              # `pending` and `missing` both have to reach zero (#1435).
              #
              # Both of this loop's exit conditions are defined as absences —
              # nothing failing, nothing pending — so an EMPTY rollup satisfies
              # them exactly as a green one does. A head SHA that carries no
              # check-runs at all therefore read as "all checks settled" and
              # went straight to the FF push. That is not hypothetical: during
              # the 2026-08-06 Actions outage eight open PRs sat with only a
              # skipped advisory bot on their heads, one `ready-to-merge` label
              # away from landing with zero test evidence.
              #
              # `missing` is the required contexts with no check-run on the SHA,
              # which is the presence floor the absence-tests lack: it turns
              # "nothing is objecting" into "the things that must pass, ran".
              # It is waited on rather than aborted on because immediately
              # after a push every context is legitimately missing — missing
              # and not-yet-started are the same observation, distinguished
              # only by time. The deadline below does the distinguishing.
              #
              # Whether the ruleset would have caught it is UNKNOWN, in both
              # directions, and the gate deliberately does not depend on the
              # answer. Ruleset 15575532 is active on refs/heads/main and
              # carries both `pull_request` and `required_status_checks`; its
              # sole bypass actor is RepositoryRole 5 in bypass_mode
              # `pull_request`, which does not cover a direct push. Yet this
              # job has FF-pushed to main 26 times, so the `pull_request` rule
              # plainly does not reject these pushes — most likely because
              # GitHub recognises pushing an open PR's head as merging that
              # PR. If that is what happens, the same recognition governs
              # `required_status_checks`, and every one of those 26 pushes
              # carried five green contexts, so none of them discriminates.
              #
              # The hole is therefore latent rather than observed: no merged PR
              # has landed without its required contexts. Do not resolve the
              # question by experiment on `main`.
              pending=$(echo "${verdict}" | jq -r '.pending | length')
              missing=$(echo "${verdict}" | jq -r '.missing | length')
              if [ "${pending}" = "0" ] && [ "${missing}" = "0" ]; then
                  advisory=$(echo "${verdict}" | jq -r '.advisory_failing | join(", ")')
                  if [ -n "${advisory}" ]; then
                      echo "advisory check(s) failing, not gating merge: ${advisory}"
                  fi
                  echo "all gating checks settled, and every required context reported."
                  break
              fi
              pending_names=$(echo "${verdict}" | jq -r '.pending | join(", ")')
              missing_names=$(echo "${verdict}" | jq -r '.missing | join(", ")')
              echo "...${pending} gating check(s) running: ${pending_names:-none}"
              echo "   ${missing} required context(s) not yet reported: ${missing_names:-none}"
              echo "   sleeping 20s"
              sleep 20
          done

          if [ "$(date +%s)" -ge "${deadline}" ]; then
              fail_and_unlabel "timed out waiting for this branch's gating checks (every check-run except the advisory bots) to complete after $((CHECK_TIMEOUT_SECONDS / 60)) minutes. The job log names which were still running and which required contexts never reported. Retrigger once they have settled."
          fi

          echo "[6/6] FF push..."
          # Push the existing signed head to main. Branch protection's
          # required-signatures rule sees the commits' signatures and
          # accepts.
          if ! git push origin "${HEAD_SHA}:refs/heads/main" 2>/tmp/push.err; then
              push_err=$(cat /tmp/push.err)
              fail_and_unlabel "FF push to \`main\` failed:\n\n\`\`\`\n${push_err}\n\`\`\`\n\nCommon causes: branch protection rule changed, force-push detected by another writer, or token permission insufficient. Re-add the label after investigating."
          fi

          # Success: unlabel and post a confirmation. Don't error if
          # the unlabel step fails — main already advanced; the worst
          # case is a stale label that a sister session sees and
          # ignores because the PR will be CLOSED/MERGED already.
          gh pr edit "${PR_NUMBER}" --remove-label ready-to-merge || true

          cat > /tmp/comment.md <<EOF
          <!-- merge-train-v1 -->
          **merge-train: merged** ${HEAD_SHA} → \`main\` via FF push.
          EOF
          jq -Rs '{body: .}' < /tmp/comment.md > /tmp/payload.json
          gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/comments" \
              --input /tmp/payload.json >/dev/null

          # #634: auto-close linked issues. GitHub's auto-close-on-merge
          # only fires when a merge commit lands; FF push (required here
          # by the signed-commit branch-protection model) doesn't trigger
          # it. Parse the PR body for `Closes #N` / `Fixes #N` /
          # `Resolves #N` (case-insensitive, GitHub's standard keywords)
          # and close each match explicitly. Failures here log but do
          # not fail the workflow — the merge has already landed.
          echo "[7/7] auto-closing linked issues..."
          pr_body=$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json body \
              --jq '.body // ""' | head -c 8192)

          # Extract `<keyword> #<num>` matches. `-i` for case-insensitive,
          # `-oE` keeps just the matched text, then sed strips down to
          # the issue numbers. Dedupe with sort -u.
          linked_issues=$(printf '%s' "${pr_body}" \
              | grep -ioE '\b(closes|fixes|resolves)[[:space:]]+#[0-9]+' \
              | sed -E 's/.*#([0-9]+)/\1/' \
              | sort -u || true)

          if [ -z "${linked_issues}" ]; then
              echo "  no linked issues parsed from PR body."
          else
              for n in ${linked_issues}; do
                  # Skip if already closed — idempotent.
                  state=$(gh issue view "${n}" --repo "${REPO}" \
                      --json state --jq '.state' 2>/dev/null || echo "")
                  if [ "${state}" = "CLOSED" ]; then
                      echo "  #${n}: already closed, skipping."
                      continue
                  fi
                  if gh issue close "${n}" --repo "${REPO}" \
                      --reason completed \
                      --comment "Shipped via PR #${PR_NUMBER} (merged ${HEAD_SHA})." \
                      2>&1; then
                      echo "  #${n}: closed."
                  else
                      echo "  #${n}: close failed (non-fatal; merge already landed)." >&2
                  fi
              done
          fi
