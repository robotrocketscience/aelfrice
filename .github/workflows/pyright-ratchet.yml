name: pyright-ratchet

# #1503 — four documents asserted `pyright --strict` passes. It emits 987
# errors and NO workflow ran it, so the tick was self-reported. The operator
# ruling of 2026-08-19 is to drive the count to zero and gate it; this job is
# the ratchet that makes the burn-down monotonic. Without it, clearing one
# module while another gains errors is a leaky bucket.
#
# Per file, not a repo total: a total lets a fix in one module pay for a
# regression in another, by unrelated authors in unrelated changes.
#
# Gates `pyright src/` — the command the documents name, over the code that
# ships. `pyproject.toml` also includes `tests`, which raises the count to
# 6,938; gating that today would freeze a number seven times larger and make
# every test edit fight the ratchet. `scripts/check_pyright_baseline.py`
# states that scope rather than letting the job name imply full coverage.

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  push:
    branches: [main]
  # #1423: the `push` arm cannot fire — the merge train FF-pushes with
  # `secrets.GITHUB_TOKEN` and GitHub raises no workflow runs from that token.
  # `merge-train.yml` dispatches this workflow after a successful FF.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pyright-ratchet-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen --all-extras
      # No `continue-on-error`: a ratchet that cannot fail is the self-reported
      # tick this issue was filed about, wearing a CI badge.
      - run: uv run python scripts/check_pyright_baseline.py
