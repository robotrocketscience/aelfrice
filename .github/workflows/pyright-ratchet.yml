name: pyright-ratchet

# #1503 — four documents asserted `pyright --strict` passes. The baseline that
# landed with #1503 — `git show ce9e5461:pyright_baseline.json` — records 987
# errors over 76 files, and NO workflow ran it, so the tick was
# self-reported. This job is the ratchet. The operator ruling of 2026-08-26
# cancelled the burn-down, so the ratchet is the whole answer and the count
# falls only as a side effect of other work.
#
# Per file, not a repo total: a total lets a fix in one module pay for a
# regression in another, by unrelated authors in unrelated changes.
#
# Gates `pyright src/` — the command the documents name, over the code that
# ships. `pyproject.toml` also includes `tests`, and the count over both is
# several times larger; run `uv run pyright` under `uv sync --all-groups
# --all-extras` to read it. No document records that figure, because it moves
# with every test edit — which is also why gating `tests/` today would put
# every test edit in conflict with the ratchet.
# `scripts/check_pyright_baseline.py` states that scope rather than letting
# the job name imply full coverage.

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  push:
    branches: [main]
  # #1423: the `push` arm cannot fire — the merge train FF-pushes with
  # `secrets.GITHUB_TOKEN` and GitHub raises no workflow runs from that token.
  # `merge-train.yml` dispatches this workflow after a successful FF.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pyright-ratchet-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
      # Pinned to a hash and credentials dropped: zizmor's `unpinned-uses`
      # is a High finding and `artipacked` a Medium, and a NEW workflow should
      # not add either to code scanning. The other workflows predate the
      # policy; this one does not get to.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen --all-extras
      # No `continue-on-error`: a ratchet that cannot fail is the self-reported
      # tick this issue was filed about, wearing a CI badge.
      - run: uv run python scripts/check_pyright_baseline.py
