name: E2E

# End-to-end suite (#334). Triggers:
#  - every PR that touches code (#1420 §1).
#  - push to main (post-merge regression catch).
# Failure surfacing (#370):
#  - push:main fail → open issue tagged `attn:e2e-failure` referencing the SHA.
#  - PR fail → add `attn:e2e-failure` label to the PR.
#
# #1420 §1: this used to run only on `push` or when someone added an `e2e`
# label, so a regression in the *installed-package* path — which the unit
# suite cannot see, because it imports from the source tree — was caught on
# `main` after merging rather than on the PR that introduced it. The label
# opt-in is gone; the `paths` filter below is what keeps docs-only PRs off it.
#
# `paths` is safe here specifically because `e2e` is NOT one of the branch's
# required contexts (those are `history-scan`, `pattern-scan`,
# `pytest (3.12)`, `pytest (3.13)`, `secrets-scan`). A path-filtered *required*
# check never reports on a PR it skips and leaves it permanently pending —
# which is why `ci.yml` deliberately has no `paths` and filters inside the job
# instead. Do not copy this pattern into a required workflow.
#
# The path list mirrors `ci.yml`'s `code` filter. Keep them in sync: a path
# that can change installed behaviour but is missing here is an e2e regression
# nobody sees until it is on main.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'benchmarks/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/e2e.yml'
  push:
    branches: [main]
  # #1423: the merge train FF-pushes with `secrets.GITHUB_TOKEN`, and GitHub
  # raises no workflow runs from that token, so the `push` arm above has not
  # fired since 2026-07-21. `merge-train.yml` dispatches this workflow after a
  # successful FF instead. `paths:` filters do not apply to a dispatch, so a
  # dispatched run always executes the full matrix — intended here, since the
  # point is a post-merge run of `main`.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        install-method: [uv-tool, pipx, venv-pip]
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install pipx
        if: matrix.install-method == 'pipx'
        run: python -m pip install --user pipx
      - name: Install via ${{ matrix.install-method }}
        run: ./tests/e2e/install-${{ matrix.install-method }}.sh
      - name: Locate installed aelf
        id: locate
        run: |
          case "${{ matrix.install-method }}" in
            uv-tool)   bin="$HOME/.local/bin/aelf" ;;
            pipx)      bin="$(pipx environment --value PIPX_BIN_DIR)/aelf" ;;
            venv-pip)  bin="$PWD/.e2e-venv/bin/aelf" ;;
          esac
          test -x "$bin" || { echo "::error::aelf binary not found at $bin"; exit 1; }
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
      - name: Run e2e suite against installed binary
        env:
          AELFRICE_E2E_BIN: ${{ steps.locate.outputs.bin }}
        run: |
          uv sync --frozen --group dev
          uv run pytest tests/e2e/ -q --maxfail=3

  surface-failure:
    needs: e2e
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
      - name: Label PR on failure
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "attn:e2e-failure"
      - name: Open issue on push:main failure
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          short_sha="${SHA:0:7}"
          gh issue create \
            --repo "$REPO" \
            --title "e2e: failure on main @ ${short_sha}" \
            --label "attn:e2e-failure" \
            --body "E2E job failed on push to \`main\` at commit \`${SHA}\`.

          **Failing run:** ${RUN_URL}

          This issue was opened automatically by \`.github/workflows/e2e.yml\` (#370). Triage: investigate the failing matrix leg(s), open a fix PR, then close this issue. If the failure is environmental and not a code regression, label \`attn:e2e-flake\` and quarantine within one business day per #334."
