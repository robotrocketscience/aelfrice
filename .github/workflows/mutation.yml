name: mutation

# Mutation testing, in two modes (#1457).
#
# The weekly job is the correctness harness: it runs the whole tree, in
# time-boxed shards (#1747), and FAILS LOUDLY if mutmut did not actually
# execute the mutants it generated. That
# guard exists because the previous version could not fail. It invoked mutmut
# with `--paths-to-mutate` / `--tests-dir`, which mutmut 3 removed, so every run
# from 2026-06-21 onward died with `Error: No such option` — and a blanket
# `|| true` on both steps turned each one into a green tick. Configuration now
# lives in `[tool.mutmut]` in `pyproject.toml`, which is where mutmut 3 reads
# it — including `also_copy`, without which the suite is not importable inside
# the `mutants/` tree mutmut runs it from and every mutant ends `not checked`.
#
# The guard asserts a positive signal, not report non-emptiness: `mutmut
# results` hides killed mutants unless `--all` is passed, so an empty report is
# what a fully-killed scope looks like. What it fails on is a zero mutant
# total, and a shard whose mutants were all left `not checked`. A shard that
# ran out of time partway leaves the rest `not checked` and warns instead.
#
# The per-PR job is advisory by ratified design (2026-08-09): a surviving mutant
# is reported, never blocking, until the equivalent-mutant rate has data behind
# it. It is scoped to the functions the PR changed, because mutmut across the
# whole tree is a multi-hour job and nothing that slow belongs on a PR.
#
# The asymmetry is deliberate. "Advisory" is what makes a step that cannot fail
# acceptable here, and it is only acceptable because the weekly job does fail on
# a broken harness. If the advisory job is ever made blocking, its exit-code
# handling has to be revisited first.

on:
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/aelfrice/**'
      - 'pyproject.toml'
      - '.github/workflows/mutation.yml'

permissions:
  contents: read

env:
  # #1472. mutmut drives pytest in-process, so every wall-clock budget in
  # the suite applies to its runs. Pinned to the unscaled value for the
  # same reason as the other pytest workflows: CI runs on a dedicated
  # runner and a looser budget is slower hang detection, not headroom.
  AELF_TEST_TIMEOUT_SCALE: "1"

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- weekly, whole tree in shards, fails on a broken harness -----------
  # #1747. One job over the whole tree never got past mutant generation: it
  # hit its 240-minute limit every week with no mutant run. The tree is now
  # planned into shards by `scripts/mutation_shards.py`, each its own matrix
  # job with its own runner and time limit, and a last job merges the shards'
  # reports. The script's docstring says how a shard is cut and why.
  plan:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen --group dev
      - name: Check the mutmut contract the plan relies on
        # The plan and the pragmas rely on how mutmut 3.8.0 counts, names,
        # and skips mutants. The tests that pin that skip in the ordinary
        # suite, where mutmut isn't installed, so they run here, against
        # the exact version the shards install, before anything is planned.
        env:
          # Turns the tests' skip-without-mutmut into a failure here.
          AELF_REQUIRE_MUTMUT: "1"
        run: |
          uv run --with 'mutmut==3.8.0' pytest -q \
              tests/test_mutation_shards_1747.py \
              tests/test_mutation_function_scope_1632.py
      - name: Plan the shards
        id: plan
        run: |
          # The plan counts mutants with mutmut's own generator, so it runs
          # the same exact version the shards install below.
          uv run --no-project --with 'mutmut==3.8.0' \
              python scripts/mutation_shards.py plan \
              --out mutation-plan.json --summary mutation-plan.md
          cat mutation-plan.md >> "${GITHUB_STEP_SUMMARY}"
          # The matrix below is read from the plan, so the two can't disagree.
          echo "shards=$(jq -c '[.shards[].index]' mutation-plan.json)" >> "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-plan
          path: mutation-plan.json
          retention-days: 30

  mutmut:
    needs: plan
    if: github.event_name != 'pull_request'
    name: mutmut (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Just under the 360-minute limit of a hosted runner. The time box on
    # `mutmut run` below is what normally ends the job; this is the backstop.
    timeout-minutes: 350
    strategy:
      # One shard that fails, or runs out of time, says nothing about the
      # others, so the rest keep running.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen --group dev --extra archive
      - name: Install mutmut
        # Pinned exactly, for the reason the per-PR job gives: the shard
        # plan and the pragmas that cut a file into shards both rely on how
        # this version generates and skips mutants, verified only on 3.8.0.
        run: uv pip install 'mutmut==3.8.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mutation-plan
      - name: Scope mutmut to this shard
        run: |
          # Writes `only_mutate` and the pragmas for the functions of a split
          # file that belong to other shards. It edits src/ in place, which
          # is why it refuses to run outside CI.
          uv run python scripts/mutation_shards.py apply \
              --plan mutation-plan.json --shard "${{ matrix.shard }}"
      - name: Run mutation tests
        env:
          # The time box, in minutes. A shard that runs out of time still
          # reports what it checked; the rest stay `not checked`. 330 plus
          # the 2-minute grace leaves the job's last 18 for the report and
          # the upload.
          MUTMUT_TIME_BOX_MINUTES: 330
        run: |
          # No `|| true` on the whole pipeline. A surviving mutant is a
          # non-zero exit and is not an error here, so the run's status is
          # captured rather than propagated; a *harness* failure is caught by
          # the results assertion below, which is the thing that was missing.
          #
          # Not GNU `timeout`. mutmut rewrites its `.meta` result files in
          # place, so a signal mid-write truncates one and `mutmut results`
          # then fails, and a SIGINT that lands while mutmut forks a worker
          # is swallowed. `mutation_shards.py run` keeps a copy of each
          # whole `.meta`, sends SIGINT and then SIGKILL, and puts back any
          # file a signal truncated. Exit 124 means the time box ended the run.
          status=0
          .venv/bin/python scripts/mutation_shards.py run \
              --time-box-minutes "${MUTMUT_TIME_BOX_MINUTES}" -- \
              .venv/bin/mutmut run --max-children 4 || status=$?
          echo "mutmut run exit=${status}"
          if [ "${status}" -eq 124 ]; then
            echo "::warning title=Mutation time box::shard ${{ matrix.shard }} stopped after ${MUTMUT_TIME_BOX_MINUTES} minutes; unrun mutants stay 'not checked'."
          fi
          # `--all` is required, not cosmetic: `mutmut results` skips every
          # killed mutant unless it is passed, so a scope in which everything
          # died prints the same empty report as a run that executed nothing.
          # The assertion below has to tell those two apart.
          #
          # `=true` is not optional either. mutmut declares it as
          # `@click.option("--all", default=False)` with no `is_flag=True`, so
          # click infers a BOOL that *takes an argument*: a bare `--all` exits
          # with `Error: Option '--all' requires an argument.` and writes that
          # sentence into the report instead of the results. Verified against
          # mutmut 3.7.0.
          .venv/bin/mutmut results --all=true > mutation-report.txt
          cat mutation-report.txt
      - name: Assert the run actually produced results
        run: |
          # The guard for the 2026-06-21 regression, stated as a *positive*
          # signal. Report non-emptiness cannot carry it: see the `--all` note
          # above. What a dead harness does produce is mutants stuck at `not
          # checked` (mutmut's status for a null exit code), which is what
          # this job's own first run showed for every single mutant.
          #
          # The leading `^ *` is load-bearing. `mutmut results` prints every
          # line as `print(f"    {k}: {status}")` — four hard-coded leading
          # spaces — so a pattern anchored at `^` matches nothing whatever the
          # tree looks like. A literal space-star is used rather than
          # `[[:space:]]*` so the same pattern compiles under both grep -E and
          # Python's `re`, which is what lets a test assert it against real
          # mutmut output instead of asserting a substring of this file.
          #
          # The key class is "anything but a space or a colon" (#1709).
          # mutmut names a method's mutants with `ǁ` separators
          # (`pkg.mod.xǁBoxǁshrink__mutmut_1`), and a `[A-Za-z0-9_.]` class
          # skipped every one of them. A negated ASCII class matches `ǁ`
          # whether grep reads it as one UTF-8 character or as two bytes.
          #
          # #1747: a shard that checked some mutants and ran out of time is a
          # partial result, not a broken harness, so it warns. What fails is
          # a shard that listed no mutant, or judged none of them. Judged
          # means killed, survived, or timeout, the statuses
          # `mutation_shards.CHECKED_STATUSES` counts: `no tests` or
          # `suspicious` on every mutant says nothing about the tests.
          MUTANT_LINE='^ *[^ :]+__mutmut_[0-9]+: '
          total=$(grep -cE "${MUTANT_LINE}" mutation-report.txt || true)
          killed=$(grep -cE ': killed$' mutation-report.txt || true)
          survived=$(grep -cE ': survived$' mutation-report.txt || true)
          timedout=$(grep -cE ': timeout$' mutation-report.txt || true)
          unchecked=$(grep -cE ': not checked$' mutation-report.txt || true)
          checked=$(( killed + survived + timedout ))
          if [ "${total}" -eq 0 ]; then
            echo "::error::mutmut listed no mutants at all — the harness is broken, not the tree."
            echo "--- report ---"
            cat mutation-report.txt
            exit 1
          fi
          if [ "${checked}" -eq 0 ]; then
            echo "::error::none of ${total} mutants was killed, survived, or timed out — the run stopped before executing any. The 'Run mutation tests' step log shows where mutmut stopped."
            grep -vE ': (killed|survived|timeout)$' mutation-report.txt | head -20
            exit 1
          fi
          if [ "${unchecked}" -ne 0 ]; then
            echo "::warning title=Partial mutation run::${unchecked} of ${total} mutants in shard ${{ matrix.shard }} are 'not checked'."
          fi
          echo "mutants: ${total} total, ${killed} killed, ${survived} survived, ${unchecked} not checked"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mutation-report-${{ matrix.shard }}
          path: mutation-report.txt
          retention-days: 30

  report:
    needs: [plan, mutmut]
    # Also after a failed shard: the merged report is most useful then.
    if: always() && github.event_name != 'pull_request' && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mutation-plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          # Each shard's report lands in its own `mutation-report-<shard>/`.
          pattern: mutation-report-*
          path: reports
      - name: Merge the shard reports
        run: |
          # Fails when a planned shard left no report, or when no shard
          # checked a single mutant. The merge is plain Python and needs no
          # project install.
          # With no shard report at all, the glob expands to nothing and
          # every planned shard is reported missing.
          shopt -s nullglob
          status=0
          python3 scripts/mutation_shards.py merge --plan mutation-plan.json \
              --summary mutation-summary.md reports/mutation-report-*/ \
              || status=$?
          if [ -f mutation-summary.md ]; then
            cat mutation-summary.md >> "${GITHUB_STEP_SUMMARY}"
          fi
          exit "${status}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mutation-summary
          path: mutation-summary.md
          retention-days: 30

  # --- per PR, changed functions only, advisory --------------------------
  # `continue-on-error` is load-bearing, not decoration. merge-train gates on
  # every non-advisory check-run on the head SHA, so a job that reports failure
  # blocks the merge — which is exactly what "advisory" must not do. This keeps
  # the job's failure off the train while its findings stay visible in the step
  # summary. While the job runs, merge-train doesn't wait for it: the name is
  # in `merge_train_gate.NONGATING_WHILE_PENDING` (#1633), which a test ties to
  # this line. If mutation is ever promoted to blocking, this line comes out
  # and the name comes out of that set, so the train waits for the result.
  # Making it advisory by name instead would mean adding it to
  # `merge_train_gate.ADVISORY_NAMES`, which drops its result from the gate.
  diff:
    name: mutation (advisory, PR diff)
    if: github.event_name == 'pull_request'
    # NOTE: job-level, not step-level. Every other `continue-on-error` in
    # `.github/workflows/` is on a step, where it only spares that step; the
    # property needed here is that the *job's* check-run conclusion is
    # `success` even when a step fails, which is what keeps merge-train's
    # "nothing failing" test satisfied. A test pins the level, because moving
    # this line two levels down would still parse and would silently make the
    # job blocking.
    continue-on-error: true
    runs-on: ubuntu-latest
    # Not 30. mutmut runs the whole suite once to collect stats before it
    # executes a single mutant, and only then starts the per-mutant runs — a
    # 30-minute cap spends a large fraction of its budget before the first
    # mutant and then dies partway through them. This is a cap, not a target;
    # the job is advisory and `concurrency` cancels it on the next push.
    timeout-minutes: 60
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          # zizmor artipacked: this job pushes nothing, so the token has
          # no reason to persist into the runner's git config.
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen --group dev --extra archive
      - name: Install mutmut
        # Pinned exactly, not to the major. `mutation_scope.py` relies on
        # how this version reads `# pragma: no mutate block` and which
        # functions it skips, verified only on 3.8.0; the contract tests in
        # tests/test_mutation_function_scope_1632.py skip where mutmut is
        # not installed, so a silent bump would go unchecked. Bumping this
        # requires re-running those tests locally with the new version.
        run: uv pip install 'mutmut==3.8.0'
      - name: Scope mutmut to the PR's changed files
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Three dots, not two. `git diff A B` is the difference between two
          # trees, so it includes everything merged into `main` since the
          # branch point and would mutate files this PR never touched. The
          # merge-base form `A...B` is the PR's own diff, which is what AC1
          # asks for.
          # #1605: `only_mutate` takes FILE paths, so a file enters the
          # mutant set whole. A comment-only edit to a large module
          # therefore costs as much as rewriting it — on `cli.py`, 11k
          # lines, that exceeded this job's budget and was cancelled with
          # no report. `mutation_scope.py` drops files whose diff cannot
          # carry a mutant, by comparing ASTs with docstrings stripped.
          # It lives in a script because the workflow cannot be tested in
          # CI (#1436): `tests/test_mutation_scope.py` tests the file pass
          # and `tests/test_mutation_function_scope_1632.py` the function
          # pass.
          # #1632: a real change to one function of `cli.py` still put all
          # of it in scope, and the job's log stayed at "Generating mutants"
          # until its 60-minute limit. `--write-pragmas` marks every function this PR did not
          # change with mutmut's `# pragma: no mutate block`, in this
          # throwaway checkout only, so mutmut never generates their
          # mutants. Filtering mutant names after generation would not help:
          # generation is the cost. The summary lists every function in
          # scope and everything left out, with the reason. The script
          # refuses `--write-pragmas` unless CI=true, which Actions sets.
          changed=$(uv run python scripts/mutation_scope.py \
              --base "${BASE_SHA}" --head "${HEAD_SHA}" \
              --write-pragmas --summary mutation-scope.md)
          cat mutation-scope.md
          cat mutation-scope.md >> "${GITHUB_STEP_SUMMARY}"
          if [ -z "${changed}" ]; then
            echo "no changed function carries a mutable change — nothing to mutate"
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "${changed}"
          echo "skip=false" >> "${GITHUB_OUTPUT}"
          # AC1: restrict the mutant set to the diff. `only_mutate` is a
          # `[tool.mutmut]` key, so the scoping is written into the config
          # mutmut already reads rather than passed as a flag mutmut 3 does
          # not have.
          python3 - "${changed}" <<'PY'
          import sys, pathlib
          files = [f for f in sys.argv[1].split("\n") if f.strip()]
          p = pathlib.Path("pyproject.toml")
          text = p.read_text(encoding="utf-8")
          entries = "".join(f'    "{f}",\n' for f in files)
          text = text.replace(
              "[tool.mutmut]\n",
              "[tool.mutmut]\nonly_mutate = [\n" + entries + "]\n",
              1,
          )
          p.write_text(text, encoding="utf-8")
          print("only_mutate scoped to:", files)
          PY
      - name: Run mutation tests on the diff (advisory)
        if: steps.scope.outputs.skip != 'true'
        run: |
          uv run mutmut run --max-children 4 || echo "mutmut run exit=$?"
          # `--all=true` for the same reason, and in the same spelling, as the
          # weekly job: without it the killed mutants are invisible, and a
          # bare `--all` is a click usage error rather than a flag.
          uv run mutmut results --all=true > mutation-report.txt || true
          cat mutation-report.txt
      - name: Report
        if: steps.scope.outputs.skip != 'true'
        run: |
          # AC3: say the verdict is advisory in the job's own output, so a
          # green tick is not read as "no mutants survived". The step exits 0
          # by design — see the asymmetry note at the top of this file.
          #
          # Same `^ *` note as the weekly guard: mutmut indents every result
          # line by four spaces, so an `^`-anchored count is hard-wired to 0.
          # Same `[^ :]` note too: method mutants carry `ǁ` in the key (#1709).
          MUTANT_LINE='^ *[^ :]+__mutmut_[0-9]+: '
          total=$(grep -cE "${MUTANT_LINE}" mutation-report.txt || true)
          killed=$(grep -cE ': killed$' mutation-report.txt || true)
          survived=$(grep -cE ': survived$' mutation-report.txt || true)
          unchecked=$(grep -cE ': not checked$' mutation-report.txt || true)
          listed=$(( ${killed:-0} + ${survived:-0} ))
          # #1746: when mutmut stops before running any mutant (a failing
          # clean run inside `mutants/`, no tests found for any mutant, or a
          # failed forced-fail check), every mutant stays `not checked`. The
          # step still exits 0, so
          # say so where a reader looks: the annotation list and the top of
          # the summary.
          checked_nothing=""
          if [ "${total:-0}" -eq 0 ]; then
            checked_nothing="mutmut listed no mutants at all, so this run tested nothing."
          elif [ "${unchecked:-0}" -eq "${total:-0}" ]; then
            checked_nothing="all ${total} mutants are 'not checked', so this run tested nothing. The 'Run mutation tests' step log shows where mutmut stopped."
          fi
          if [ -n "${checked_nothing}" ]; then
            echo "::warning title=Mutation run checked nothing::${checked_nothing}"
          fi
          {
            echo "## Mutation (advisory)"
            echo
            if [ -n "${checked_nothing}" ]; then
              echo "> [!WARNING]"
              echo "> ${checked_nothing}"
              echo
            fi
            echo "Scoped to the functions this PR changed under \`src/aelfrice/\`;"
            echo "the scope table above lists them."
            echo "**This job never fails the PR.** A green tick here means the"
            echo "job ran, not that every mutant was killed — read the list."
            echo
            echo "| mutants | killed | survived |"
            echo "| --- | --- | --- |"
            echo "| ${total:-0} | ${killed:-0} | ${survived:-0} |"
            echo
            # Anything that is neither killed nor survived is a harness
            # signal, not a coverage signal, and is reported apart from the
            # survivor tally so the two are never read as one number.
            echo "Other statuses (harness signals, not coverage):"
            echo
            echo '```'
            # Every status in mutmut 3's `status_by_exit_code` (stats.py)
            # other than killed and survived, so the counts add up to the
            # total (#1709). A status a later mutmut adds is reported as
            # unlisted rather than dropped.
            for status in 'no tests' 'timeout' 'suspicious' 'skipped' \
                'not checked' 'caught by type check' 'segfault' \
                'check was interrupted by user'; do
              n=$(grep -cE ": ${status}\$" mutation-report.txt || true)
              listed=$(( listed + ${n:-0} ))
              echo "${status}: ${n:-0}"
            done
            if [ "${listed}" -ne "${total:-0}" ]; then
              echo "unlisted status: $(( ${total:-0} - listed ))"
            fi
            echo '```'
            echo
            echo "Surviving mutants:"
            echo
            echo '```'
            grep -E ': survived$' mutation-report.txt | head -100 || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
      # Pinned, unlike the weekly job's copy above and every other
      # upload-artifact in this repo. zizmor's code-scanning arm reports
      # an unpinned `uses:` in *changed* code as a new error-severity
      # alert, so a job added today has to meet the blanket policy even
      # where the surrounding file does not yet.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.scope.outputs.skip != 'true'
        with:
          name: mutation-report-diff
          path: mutation-report.txt
          retention-days: 30
