# Dependabot version updates for the Python dependencies (#1542, #1786).
#
# The `uv` ecosystem reads pyproject.toml and rewrites uv.lock in the same
# PR. A `pip` updater bumps pyproject.toml and leaves uv.lock at the old
# pins, and CI passes that PR: `uv sync --frozen` installs the old pins,
# then each plain `uv run` step re-locks in the runner and installs the
# new ones. The tests run on the new versions, and the stale uv.lock
# merges.
# Updates arrive weekly: minor and patch bumps grouped into one PR, a major
# bump as its own PR, at most five open PRs at a time. Dependabot waits
# seven days after a release before it proposes that version, the shortest
# cooldown zizmor's dependabot-cooldown audit accepts. The cooldown covers
# version updates only, so a security update still opens once an alert has
# a patched version. Each PR carries the
# `dependencies` and `python:uv` labels, the ones Dependabot's security
# updates already apply, and a `build(deps):` subject, which the
# commit-msg-prefix and pr-title-prefix checks accept. Nothing here merges
# a PR: a person reads the diff and adds `ready-to-merge`, and the merge
# train takes it from there. See the `ready-to-merge` section of
# CONTRIBUTING.md.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python:uv"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
